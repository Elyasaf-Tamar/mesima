<script>
'use strict';
/* ==========================================================================
   משימה 0.3
   Store  – נתונים. נקודת ההחלפה היחידה לסנכרון ענן בעתיד.
   Geo    – מרחקים, מעקב, וצבירת מרחק נסיעה.
   Search – חיפוש מקומות לפי שם (שני ספקים + נפילה לידני).
   Alerts – רטט/צליל/התראה.
   Cal    – עזרי יומן + ייצוא ICS.
   UI     – רינדור בלבד.
   Engine – מנוע התזכורות.
   ========================================================================== */

/* חותמת גרסה. הבודק מול השרת מחפש בדיוק את השורה הזאת. */
const BUILD = '2.1 · 2026-08-26';

/* ------------------------------- Store ---------------------------------- */
const Store = (() => {
  const KEY = 'mesima.v1';
  const seed = () => ({ v:4, tasks:[], places:[], lists:[], events:[], notes:[],
                        eventTypes:[],
                        prefs:{ vib:true, snd:true, geo:false, notif:false, noteZoom:1 } });

  let persist = true;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
  catch(e){ persist = false; }

  let data;
  try {
    const raw = persist ? localStorage.getItem(KEY) : null;
    data = raw ? Object.assign(seed(), JSON.parse(raw)) : seed();
  } catch(e){ data = seed(); }
  /* מיגרציות */
  if (!Array.isArray(data.events)) data.events = [];
  if (!data.prefs) data.prefs = seed().prefs;
  if (!data.prefs.noteZoom) data.prefs.noteZoom = 1;
  if (!Array.isArray(data.lists)) data.lists = [];
  if (!Array.isArray(data.notes)) data.notes = [];
  /* v2 -> v3: רשימת הקניות השטוחה הופכת לרשימה אחת מסוג "פשוט" */
  if (Array.isArray(data.shop) && data.shop.length){
    data.lists.unshift({
      id:'migrated-shop', name:'קניות', kind:'simple', forWho:'', phone:'',
      createdAt:Date.now(),
      items:data.shop.map(x=>({ id:x.id, title:x.title, where:x.where||'', link:'', img:'',
                                done:!!x.done, price:null, note:'', releaseDate:'', notified:false }))
    });
  }
  delete data.shop;
  /* הרגל שסומן "בוצע" נעלם מכל התצוגות ואי אפשר להחזיר אותו.
     זה קרה בגלל שכפתור "בוצע" בהתראה קרא ל-toggleTask. מרפאים למפרע. */
  data.tasks.forEach(t=>{
    if (t.repeat && t.repeat.times && t.repeat.times.length && t.done){
      t.done = false; t.doneAt = null; t.autoDone = false;
    }
  });
  data.tasks.forEach(t=>{ if(t.parentId===undefined) t.parentId=null;
                          if(t.planned===undefined) t.planned=null;
                          if(t.eventId===undefined) t.eventId=null;
                          if(t.note===undefined) t.note='';
                          if(t.repeat===undefined) t.repeat=null;
                          if(!t.log) t.log={}; });
  data.places.forEach(p=>{ if(p.parentId===undefined) p.parentId=null; });
  data.events.forEach(e=>{
    if (!['army','home','personal'].includes(e.cat)) e.cat = 'personal';
    if (e.note === undefined) e.note = '';
    if (e.taskIds !== undefined) delete e.taskIds;
    if (e.endDate === undefined) e.endDate = '';
    if (!e.end){                       /* גרסאות ישנות שמרו אורך בדקות */
      const [h,m] = (e.time||'09:00').split(':').map(Number);
      const t = h*60 + m + (e.mins || 60);
      e.end = String(Math.floor(t/60) % 24).padStart(2,'0') + ':' + String(t % 60).padStart(2,'0');
    }
  });
  /* ---------- v3 -> v4 (גרסה 2.0) ---------- */
  if (!Array.isArray(data.eventTypes)) data.eventTypes = [];
  if (!data.eventTypes.length){
    /* סוגי אירוע נולדים מהקטגוריות הישנות, ומכאן ואילך הם עצמאיים */
    data.eventTypes = [
      { id:'t_army', name:'צבא',  color:'#7aa2f7' },
      { id:'t_home', name:'בית',  color:'#e0a458' },
      { id:'t_pers', name:'אישי', color:'#b48ead' },
    ];
  }
  const CAT2TYPE = { army:'t_army', home:'t_home', personal:'t_pers' };
  data.events.forEach(e => {
    if (!e.typeId) e.typeId = CAT2TYPE[e.cat] || 't_pers';
  });

  data.tasks.forEach(t => {
    /* מחזור חיים: קצר-טווח (נגמר) מול ארוך-טווח (מיכל שלא נגמר מעצמו) */
    if (t.kind !== 'short' && t.kind !== 'long') t.kind = 'short';
    /* ארכיון: כל מה שכבר סומן כבוצע עובר לארכיון ולא נעלם */
    if (t.archived === undefined){
      t.archived  = !!t.done;
      t.archivedAt = t.done ? (t.doneAt || Date.now()) : null;
    }
    if (t.autoArch === undefined) t.autoArch = false;
    /* הרגל הוא משימה רגילה — הוא לא "נגמר" ולכן לא מגיע לארכיון */
    if (t.repeat && t.repeat.times && t.repeat.times.length){
      t.archived = false; t.archivedAt = null; t.done = false; t.doneAt = null;
    }
  });
  /* ---------- v4 -> v5: פריט ארוך-טווח לא יכול להיות הרגל בעצמו ----------
     אם נשמר לו לוח חזרות, מעבירים אותו לתת-משימה קצרת-טווח אחת ומסמנים
     שהטיפול בוצע, כדי שטעינה חוזרת לא תיצור כפילויות. */
  data.tasks.slice().forEach(t => {
    if (t.kind !== 'long' || !t.repeat || !t.repeat.times || !t.repeat.times.length) return;
    if (!t.repeatMovedTo || !data.tasks.some(x => x.id === t.repeatMovedTo)){
      const child = {
        id: (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
        mission: t.mission, title: t.title, done:false, createdAt: Date.now(), doneAt:null,
        reminder:null, rt:{}, parentId: t.id, planned:null, eventId:null, note:'',
        repeat: t.repeat, log: t.log || {}, collapsed:true, kind:'short',
        archived:false, archivedAt:null, autoArch:false,
      };
      data.tasks.push(child);
      t.repeatMovedTo = child.id;
    }
    t.repeat = null; t.log = {};
  });
  data.v = 4;

  const subs = [];
  const save = () => {
    if (persist) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ persist = false; } }
    subs.forEach(f => f());
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  return {
    get canPersist(){ return persist; },
    get all(){ return data; },
    onChange(f){ subs.push(f); },
    commit: save,

    tasks(m){ return data.tasks.filter(t => t.mission === m && !t.archived); },
    /** כל המשימות הפעילות, אופציונלית מסוננות לפי קטגוריה. 'all' = הכול */
    active(cat){ return data.tasks.filter(t => !t.archived && (!cat || cat==='all' || t.mission===cat)); },
    task(id){ return data.tasks.find(t => t.id === id); },
    /** ילדים ישירים של משימה. null = משימות שורש. */
    children(parentId, mission){
      return data.tasks.filter(t => t.parentId === parentId && !t.archived &&
                                    (mission == null || mission === 'all' || t.mission === mission));
    },
    /** ילדים כולל מאורכבים — לתצוגת עץ בארכיון */
    childrenAll(parentId){ return data.tasks.filter(t => t.parentId === parentId); },
    /** כל הצאצאים לכל עומק — לספירה ולמחיקה רקורסיבית */
    descendants(id){
      const out = [];
      const walk = pid => data.tasks.forEach(t => { if (t.parentId === pid){ out.push(t); walk(t.id); } });
      walk(id); return out;
    },
    depth(id){
      let d = 0, t = this.task(id);
      while (t && t.parentId){ d++; t = this.task(t.parentId); }
      return d;
    },
    addTask(o){
      const t = { id:uid(), mission:o.mission, title:o.title, done:false,
        createdAt:Date.now(), doneAt:null, reminder:o.reminder||null, rt:o.rt||{},
        parentId:o.parentId||null, planned:o.planned||null, eventId:o.eventId||null,
        note:o.note||'', repeat:o.repeat||null, log:{}, collapsed:true,
        kind:(o.kind==='long'?'long':'short'), archived:false, archivedAt:null, autoArch:false };
      /* תת-משימה יורשת את המשימה-על של ההורה, אחרת היא נעלמת מהתצוגה */
      if (t.parentId){ const p = this.task(t.parentId); if (p) t.mission = p.mission; }
      data.tasks.unshift(t); save(); return t;
    },
    updateTask(id, patch){
      const t=this.task(id); if(!t) return;
      const rt = patch.rt;              /* אפשר לקבוע rt מפורש — למשל "אל תירה היום" */
      Object.assign(t, patch);
      t.rt = rt || {};
      save();
    },
    setPlanned(id, date){ const t=this.task(id); if(t){ t.planned=date; save(); } },
    toggleCollapse(id){ const t=this.task(id); if(t){ t.collapsed=!t.collapsed; save(); } },
    /** משימות שתוכננו ליום מסוים */
    plannedFor(date){ return data.tasks.filter(t => t.planned === date && !t.archived && !this.isHabit(t)); },
    /** משימות שקושרו לאירוע */
    tasksForEvent(eventId){ return data.tasks.filter(t => t.eventId === eventId && !t.archived); },
    linkTask(taskId, eventId){
      const t = this.task(taskId); if(!t) return;
      t.eventId = eventId || null;
      const ev = eventId ? this.event(eventId) : null;
      if (ev && !t.planned) t.planned = ev.date;   /* נוח: המשימה נוחתת ביום האירוע */
      save();
    },
    /* ---------- הרגל יומי ----------
       t.repeat = { days:[0..6], times:['08:00','16:00'] }
       t.log    = { '2026-08-26': 1 }  — קיום המפתח = היום סומן */
    /* פריט ארוך-טווח לעולם אינו הרגל בעצמו — ההרגל הוא תת-משימה שלו.
       הבדיקה מגנה גם על נתונים ישנים שנשמרו לפני התיקון. */
    isHabit(t){ return !!(t && t.kind !== 'long' &&
                          t.repeat && t.repeat.times && t.repeat.times.length); },
    habitDay(t, date){
      const d = new Date(date + 'T00:00:00').getDay();
      return (t.repeat.days || []).includes(d);
    },
    /* השעות הן ניסיונות חוזרים על אותה משימה, לא שלבים:
       סימון אחד סוגר את היום ומשתיק את השעות שנותרו. */
    habitFull(t, date){ return !!(t.log && t.log[date]); },
    tickHabit(id, date){
      const t = this.task(id); if(!t || !this.isHabit(t)) return null;
      t.log = t.log || {};
      t.log[date] = 1;
      t.rt = t.rt || {};
      save();
      return { full:true, streak:this.streak(id) };
    },
    untickHabit(id, date){
      const t = this.task(id); if(!t) return;
      if (t.log) delete t.log[date];
      save();
    },
    /** ימים ברצף. יום שאינו יום-חובה נדלג עליו ולא שובר. */
    streak(id){
      const t = this.task(id); if(!t || !this.isHabit(t)) return 0;
      let n = 0, k = Plan.today(), first = true, guard = 0;
      while (guard++ < 400){
        if (this.habitDay(t, k)){
          if (this.habitFull(t, k)) n++;
          else if (!first) break;          /* היום עוד לא נגמר — לא שובר */
        }
        first = false;
        k = Plan.shift(k, -1);
      }
      return n;
    },
    habitsFor(date){
      return data.tasks.filter(t => this.isHabit(t) && !t.archived && this.habitDay(t, date));
    },

    /**
     * סימון ✓ בתצוגה. להרגל זה סימון יומי; לכל השאר זה סיום — והמשימה
     * עוברת מיד לארכיון, כפי שדורש סעיף 25 באפיון.
     */
    toggleTask(id, date){
      const t = this.task(id); if(!t) return;
      if (this.isHabit(t)){
        const d = date || Plan.today();
        if (this.habitFull(t, d)) this.untickHabit(id, d); else this.tickHabit(id, d);
        return;
      }
      this.finishTask(id);
    },

    /* ---------- מחזור חיים וארכיון (2.0) ---------- */
    isLong(t){ return !!t && t.kind === 'long'; },

    /**
     * סיום משימה קצרת-טווח. המשמעות היא "אני מחשיב את כל הדבר הזה כגמור",
     * ולכן כל העץ עובר לארכיון — גם אם נשארו בו תת-משימות פתוחות.
     * המצב הפנימי של הילדים נשמר כדי שהשחזור יחזיר את התמונה המדויקת.
     */
    finishTask(id){
      const t = this.task(id); if(!t) return;
      if (this.isHabit(t)){ this.tickHabit(id, Plan.today()); return; }
      const now = Date.now();
      t.done = true; t.doneAt = now; t.rt = {}; t.planned = null;
      t.archived = true; t.archivedAt = now; t.autoArch = false;
      this.descendants(id).forEach(c => {
        if (!c.archived){ c.archived = true; c.archivedAt = now; c.autoArch = true;
                          c.rt = {}; c.planned = null; }
      });
      save();
    },
    /** סגירה מפורשת של פריט ארוך-טווח */
    closeProject(id){ this.finishTask(id); },
    /** מעבר לארוך-טווח: המיכל לא נושא זמן, מיקום, נסיעה, תאריך או חזרה */
    makeLong(id){
      const t = this.task(id); if(!t) return;
      t.kind = 'long'; t.reminder = null; t.repeat = null; t.planned = null;
      t.log = {}; t.rt = {};
      save();
    },

    /** החזרה מהארכיון — המשימה וכל מה שאורכב יחד איתה */
    restoreTask(id){
      const t = this.task(id); if(!t) return;
      t.archived = false; t.archivedAt = null; t.done = false; t.doneAt = null; t.autoArch = false;
      this.descendants(id).forEach(c => {
        if (c.autoArch){ c.archived = false; c.archivedAt = null; c.autoArch = false; }
      });
      /* אב מאורכב היה מסתיר את המשימה המשוחזרת */
      let p = t.parentId ? this.task(t.parentId) : null, guard = 0;
      while (p && guard++ < 12){
        if (p.archived){ p.archived = false; p.archivedAt = null; p.done = false; p.doneAt = null; }
        p = p.parentId ? this.task(p.parentId) : null;
      }
      save();
    },
    /* ---------- רשימה לשימוש חוזר ----------
       "רשימה" היא לא ישות חדשה — זו משימה עם תת-משימות. איפוס מחזיר את
       הפריטים שסומנו למצב פעיל, בלי לשכפל ובלי למחוק היסטוריה גלובלית.
       הפונקציה טהורה ומקבלת מזהה בלבד, כך שאיפוס אוטומטי בעתיד
       (כל יום ראשון, כל שבוע) יוכל לקרוא לה בלי שינוי נוסף. */

    /** כמה פריטים בעץ הזה יחזרו לפעילים */
    resettableCount(id){
      return this.descendants(id).filter(c => c.archived || c.done).length;
    },
    /** האם בכלל יש כאן רשימה — כלומר תת-משימות כלשהן */
    hasChecklist(id){ return this.descendants(id).length > 0; },

    /**
     * מחזיר את כל צאצאי המשימה למצב פעיל, לכל עומק.
     * שם, הערה, מבנה, תזכורות והיררכיה נשארים בדיוק כפי שהם.
     * הרגלים לא מושפעים — הם ממילא לא מסומנים כגמורים.
     */
    resetChecklist(id){
      const t = this.task(id); if(!t) return 0;
      let n = 0;
      this.descendants(id).forEach(c => {
        if (!c.archived && !c.done) return;
        c.archived = false; c.archivedAt = null; c.autoArch = false;
        c.done = false; c.doneAt = null; c.autoDone = false;
        c.rt = c.rt || {};
        n++;
      });
      /* ההורה נשאר פעיל. אם הוא עצמו אורכב — הרשימה חוזרת איתו. */
      if (t.archived || t.done){
        t.archived = false; t.archivedAt = null; t.autoArch = false;
        t.done = false; t.doneAt = null; t.autoDone = false;
      }
      t.lastResetAt = Date.now();
      save();
      return n;
    },

    /** שורשי הארכיון: פריט שההורה שלו אינו מאורכב — כדי לא לכפול עצים */
    archived(){
      return data.tasks
        .filter(t => t.archived && !(t.parentId && (this.task(t.parentId)||{}).archived))
        .sort((a,b) => (b.archivedAt||0) - (a.archivedAt||0));
    },
    archivedCount(){ return data.tasks.filter(t => t.archived).length; },

    /* ---------- סוגי אירוע ---------- */
    eventTypes(){ return data.eventTypes; },
    eventType(id){ return data.eventTypes.find(x => x.id === id) || data.eventTypes[0] || null; },
    addEventType(name, color){
      const t = { id:uid(), name, color };
      data.eventTypes.push(t); save(); return t;
    },
    updateEventType(id, patch){ const t=data.eventTypes.find(x=>x.id===id); if(t){ Object.assign(t,patch); save(); } },
    delEventType(id){
      if (data.eventTypes.length <= 1) return false;
      data.eventTypes = data.eventTypes.filter(x => x.id !== id);
      const fb = data.eventTypes[0].id;
      data.events.forEach(e => { if (e.typeId === id) e.typeId = fb; });
      save(); return true;
    },

    delTask(id){
      const kill = new Set([id, ...this.descendants(id).map(t=>t.id)]);
      data.tasks = data.tasks.filter(x => !kill.has(x.id));
      save();
    },

    addPlace(name, lat, lng, radius, parentId){
      const p = { id:uid(), name, lat, lng, radius: radius||200, parentId: parentId||null };
      data.places.push(p); save(); return p;
    },
    delPlace(id){
      /* מחיקת מקום ראשי מוחקת גם את תת-המקומות שלו */
      const kill = new Set([id, ...data.places.filter(p=>p.parentId===id).map(p=>p.id)]);
      data.places = data.places.filter(p => !kill.has(p.id));
      data.tasks.forEach(t=>{ if(t.reminder && kill.has(t.reminder.placeId)) t.reminder = null; });
      save();
    },
    place(id){ return data.places.find(p=>p.id===id); },
    placeByName(n){ return data.places.find(p=>p.name===n); },
    /** מקומות ראשיים — רק להם יש גדר אמיתית במערכת ההפעלה */
    topPlaces(){ return data.places.filter(p => !p.parentId); },
    subPlaces(id){ return data.places.filter(p => p.parentId === id); },
    /** מטפס עד המקום הראשי. תת-מקום לעולם לא נרשם כגדר בפני עצמו. */
    placeRoot(id){
      let p = this.place(id), guard = 0;
      while (p && p.parentId && guard++ < 8) p = this.place(p.parentId);
      return p || null;
    },

    /* ---------- רשימות ---------- */
    list(id){ return data.lists.find(l => l.id === id); },
    addList(o){
      const l = { id:uid(), name:o.name, kind:o.kind||'simple', forWho:o.forWho||'',
                  phone:o.phone||'', createdAt:Date.now(), items:[] };
      data.lists.unshift(l); save(); return l;
    },
    updateList(id, patch){ const l=this.list(id); if(l){ Object.assign(l, patch); save(); } },
    delList(id){ data.lists = data.lists.filter(l=>l.id!==id); save(); },
    addItem(listId, o){
      const l = this.list(listId); if(!l) return null;
      const it = { id:uid(), title:o.title, where:o.where||'', link:o.link||'', img:o.img||'',
                   done:false, price:(o.price==null?null:o.price), note:o.note||'',
                   releaseDate:o.releaseDate||'', notified:false, createdAt:Date.now() };
      l.items.unshift(it); save(); return it;
    },
    updateItem(listId, itemId, patch){
      const l=this.list(listId); if(!l) return;
      const it=l.items.find(x=>x.id===itemId); if(!it) return;
      Object.assign(it, patch); save();
    },
    toggleItem(listId, itemId){
      const l=this.list(listId); if(!l) return;
      const it=l.items.find(x=>x.id===itemId); if(it){ it.done=!it.done; save(); }
    },
    delItem(listId, itemId){
      const l=this.list(listId); if(!l) return;
      l.items = l.items.filter(x=>x.id!==itemId); save();
    },
    /** כל הפריטים הפתוחים מכל הרשימות — לתכנון מסלול */
    openItems(){
      const out=[];
      data.lists.forEach(l => l.items.forEach(i => { if(!i.done) out.push({...i, listId:l.id, listName:l.name}); }));
      return out;
    },

    /** אירוע רב-יומי מופיע בכל יום בטווח שלו */
    onDay(e, date){ return e.endDate ? (date >= e.date && date <= e.endDate) : e.date === date; },
    events(date){
      return data.events.filter(e => this.onDay(e, date))
                        .sort((a,b) => (a.time||'').localeCompare(b.time||''));
    },
    eventCount(date){ return data.events.filter(e => this.onDay(e, date)).length; },
    event(id){ return data.events.find(e=>e.id===id); },
    addEvent(o){
      const ev = { id:uid(), title:o.title, date:o.date, time:o.time||'09:00',
        end:o.end||'10:00', endDate:o.endDate||'',
        typeId:o.typeId || (data.eventTypes[0] && data.eventTypes[0].id) || 't_pers',
        remindMin:(o.remindMin==null?15:o.remindMin), note:o.note||'', rt:{} };
      data.events.push(ev); save(); return ev;
    },
    updateEvent(id, patch){ const e=this.event(id); if(e){ Object.assign(e, patch); e.rt={}; save(); } },
    delEvent(id){
      data.events = data.events.filter(e=>e.id!==id);
      data.tasks.forEach(t=>{ if(t.eventId===id) t.eventId=null; });
      save();
    },

    /* ---------- הערות ---------- */
    notes(){ return data.notes.slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || b.updatedAt-a.updatedAt); },
    note(id){ return data.notes.find(n=>n.id===id); },
    addNote(o){
      const n = { id:uid(), title:(o&&o.title)||'', html:(o&&o.html)||'',
                  pinned:false, createdAt:Date.now(), updatedAt:Date.now() };
      data.notes.unshift(n); save(); return n;
    },
    /** silent = שמירה תוך כדי הקלדה, בלי לרנדר מחדש ולהרוס את הסמן */
    updateNote(id, patch, silent){
      const n = this.note(id); if(!n) return;
      Object.assign(n, patch); n.updatedAt = Date.now();
      if (silent){ if (persist){ try { localStorage.setItem(KEY, JSON.stringify(data)); }
                                 catch(e){ persist = false; } } }
      else save();
    },
    delNote(id){ data.notes = data.notes.filter(n=>n.id!==id); save(); },
    pinNote(id){ const n=this.note(id); if(n){ n.pinned=!n.pinned; save(); } },

    setPref(k,v){ data.prefs[k]=v; save(); },
    export(){ return JSON.stringify(data, null, 2); },
    import(json){
      const p = JSON.parse(json);
      if (!p || typeof p!=='object' || !Array.isArray(p.tasks)) throw new Error('bad');
      data = Object.assign(seed(), p);
      if (!Array.isArray(data.events)) data.events = [];
      save();
    },
    wipe(){ data = seed(); save(); },
  };
})();

/* -------------------------------- Geo ----------------------------------- */
const Geo = (() => {
  let watchId = null, last = null, lastErr = null;
  const listeners = [];
  /* צבירת מרחק נסיעה: מתאפס אחרי עצירה ממושכת */
  const NOISE_M = 20;          // מתחת לזה זה רעש GPS, לא תנועה
  const STOP_MS = 6*60*1000;   // 6 דקות בלי תנועה = הרצף נשבר
  const MAX_KMH = 250;         // מעל זה זו קפיצת GPS, לא נסיעה
  let trip = { meters:0, startedAt:null, lastMoveAt:null, prev:null };

  const R = 6371000, rad = d => d*Math.PI/180;
  function dist(a,b){
    const dLat = rad(b.lat-a.lat), dLng = rad(b.lng-a.lng);
    const s = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.min(1, Math.sqrt(s)));
  }

  function feed(fix){
    const now = fix.t, prev = trip.prev;
    last = fix;

    if (!prev){
      trip.prev = fix; trip.startedAt = now; trip.lastMoveAt = now;
      listeners.forEach(f => f(fix)); return;
    }

    const d     = dist(prev, fix);
    const dtSec = Math.max(1, (now - (prev.t || now)) / 1000);
    const kmh   = (d / 1000) / (dtSec / 3600);
    const broke = trip.lastMoveAt && (now - trip.lastMoveAt > STOP_MS);

    if (broke){
      /* עמדנו זמן רב: "ברצף" נשבר. נסיעה חדשה מתחילה כאן, בלי לספור את הפער. */
      resetTrip(now, fix);
    } else if (kmh > MAX_KMH){
      /* קפיצת GPS (מנהרה, איבוד קליטה) – מיישרים את הנקודה בלי לצבור מרחק */
      trip.prev = fix;
    } else if (d >= NOISE_M){
      trip.meters += d;
      trip.lastMoveAt = now;
      if (!trip.startedAt) trip.startedAt = now;
      trip.prev = fix;
    }
    /* d קטן מהרעש: משאירים prev כדי שזחילה איטית תצטבר ולא תיבלע */

    listeners.forEach(f => f(fix));
  }
  function resetTrip(now, fix){
    const t = now || Date.now();
    trip = { meters:0, startedAt:t, lastMoveAt:t, prev: fix || last };
  }

  return {
    dist, feed,
    get last(){ return last; },
    get lastError(){ return lastErr; },
    get on(){ return watchId !== null; },
    get trip(){ return { meters:trip.meters, startedAt:trip.startedAt, lastMoveAt:trip.lastMoveAt }; },
    resetTrip,
    onFix(f){ listeners.push(f); },
    supported(){ return !!(navigator.geolocation) && window.isSecureContext !== false; },

    /* maximumAge:0 – 20 שניות ברכב זה 300 מטר, ואז נשמר המקום הלא נכון */
    now(){
      return new Promise((res, rej) => {
        if (!navigator.geolocation) return rej({ code:-1, message:'no-geo' });
        navigator.geolocation.getCurrentPosition(
          p => { const f = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, t:Date.now() };
                 lastErr = null; feed(f); res(f); },
          e => { lastErr = e; rej(e); },
          { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
        );
      });
    },
    start(){
      if (watchId !== null || !navigator.geolocation) return false;
      watchId = navigator.geolocation.watchPosition(
        p => { lastErr = null;
               feed({ lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, t:Date.now() }); },
        err => { lastErr = err; Geo.stop();
                 UI.toast(err.code===1 ? 'הרשאת מיקום נדחתה' : 'שגיאת מיקום'); UI.render(); },
        { enableHighAccuracy:true, maximumAge:5000, timeout:27000 }
      );
      return true;
    },
    stop(){ if (watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId = null; } },

    route(from, points){
      const left = points.slice(), out = []; let cur = from, total = 0;
      while (left.length){
        let bi=0, bd=Infinity;
        left.forEach((p,i)=>{ const d=dist(cur,p); if(d<bd){bd=d;bi=i;} });
        const nx = left.splice(bi,1)[0];
        total += bd; out.push({ ...nx, leg:bd }); cur = nx;
      }
      return { stops:out, total };
    },
  };
})();

/* ------------------------------- Search --------------------------------- */
/* חיפוש מקום בשם. שלושה ספקים בטור, כולם חינמיים וללא מפתח.
   Nominatim ראשון כי הוא המנוע עם הכיסוי הטוב ביותר לעסקים, חנויות וכתובות.
   israelhiking אחרון — הוא מאגר של מפת שבילים, מצוין למעיינות וחורשות
   ולא רלוונטי לסופר או למשרד. */
const Search = (() => {
  const norm = (name, city, lat, lng) => ({ name, city:city||'', lat:+lat, lng:+lng });
  const ok = r => isFinite(r.lat) && isFinite(r.lng) && Math.abs(r.lat)<=90 && Math.abs(r.lng)<=180;

  /** תיבה של בערך 40 ק״מ סביב המשתמש — מטה את הדירוג למקומי בלי לחסום רחוקים */
  function viewbox(g, km){
    if (!g) return '';
    const d = (km || 40) / 111;
    const dLat = d, dLng = d * 1.18;
    return `&viewbox=${(g.lng-dLng).toFixed(4)},${(g.lat+dLat).toFixed(4)},`
         + `${(g.lng+dLng).toFixed(4)},${(g.lat-dLat).toFixed(4)}&bounded=0`;
  }

  async function nominatim(q0, anchor, km){
    const q = variants(q0).slice(-1)[0] || q0;
    const url = 'https://nominatim.openstreetmap.org/search'
      + '?format=jsonv2&addressdetails=1&limit=15&accept-language=he&countrycodes=il'
      + viewbox(anchor, km) + '&q=' + encodeURIComponent(q);
    const r = await fetch(url, { headers:{ 'Accept':'application/json' } });
    if (!r.ok) throw new Error('nominatim ' + r.status);
    const j = await r.json();
    return (j||[]).map(it => {
      const a = it.address || {};
      const city = a.city || a.town || a.village || a.suburb || a.county || '';
      const first = String(it.display_name||'').split(',')[0].trim();
      return norm(it.name || first, city, it.lat, it.lon);
    }).filter(ok);
  }

  async function photon(q, anchor){
    /* הטיה לנקודת הייחוס — המיקום שלך, או העיר שביקשת. */
    const g = anchor;
    const bias = g ? `&lat=${g.lat.toFixed(5)}&lon=${g.lng.toFixed(5)}` : '&lat=32.1&lon=34.9';
    const url = 'https://photon.komoot.io/api/?limit=15&lang=default' + bias
      + '&q=' + encodeURIComponent(q);
    const r = await fetch(url);
    if (!r.ok) throw new Error('photon ' + r.status);
    const j = await r.json();
    return (j.features||[]).map(f => {
      const c = f.geometry && f.geometry.coordinates; const p = f.properties||{};
      if (!c) return null;
      const city = [p.city || p.district, p.state].filter(Boolean).join(', ');
      return norm(p.name || p.street || q, city, c[1], c[0]);
    }).filter(Boolean).filter(ok);
  }

  async function israelHiking(q){
    const url = 'https://israelhiking.osm.org.il/api/search/' + encodeURIComponent(q) + '?language=he';
    const r = await fetch(url, { headers:{ 'Accept':'application/json' } });
    if (!r.ok) throw new Error('israelhiking ' + r.status);
    const j = await r.json();
    const arr = Array.isArray(j) ? j : (j.features || j.results || []);
    const pick = (o, keys) => { for (const k of keys) if (o && o[k] != null) return o[k]; return null; };
    return arr.map(it => {
      const disp = pick(it, ['displayName','DisplayName','name','title']) || '';
      let lat = pick(it, ['lat','latitude']), lng = pick(it, ['lng','lon','longitude']);
      const loc = pick(it, ['location','Location','coordinates','center']);
      if ((lat==null||lng==null) && loc){
        if (Array.isArray(loc)) { lng = loc[0]; lat = loc[1]; }
        else { lat = pick(loc,['lat','latitude','y']); lng = pick(loc,['lng','lon','longitude','x']); }
      }
      const g = it.geometry && it.geometry.coordinates;
      if ((lat==null||lng==null) && Array.isArray(g)) { lng = g[0]; lat = g[1]; }
      if (lat==null || lng==null) return null;
      const parts = String(disp).split(',');
      return norm(parts[0].trim(), parts.slice(1).join(',').trim(), lat, lng);
    }).filter(Boolean).filter(ok);
  }

  /* שמות רשתות שב-OSM רשומים באנגלית. בלי זה חיפוש בעברית מחזיר ריק
     גם כשהסניף קיים במאגר. */
  const ALIAS = {
    'סופר פארם':'Super-Pharm', 'סופרפארם':'Super-Pharm',
    'סטימצקי':'Steimatzky', 'צומת ספרים':'Tzomet Sfarim',
    'רמי לוי':'Rami Levy', 'שופרסל':'Shufersal', 'ויקטורי':'Victory',
    'יינות ביתן':'Yeinot Bitan', 'אושר עד':'Osher Ad', 'מגה':'Mega',
    'מקדונלדס':"McDonald's", 'בורגר קינג':'Burger King', 'ארומה':'Aroma',
    'קפה קפה':'Cafe Cafe', 'רולדין':'Roladin', 'מקס סטוק':'Max Stock',
    'פארם':'Pharm', 'דואר':'Israel Post', 'סונול':'Sonol', 'פז':'Paz',
    'דלק':'Delek', 'איקאה':'IKEA', 'זארה':'Zara',
    'קסטרו':'Castro', 'פוקס':'Fox', 'הום סנטר':'Home Center',
    'אייס':'ACE', 'ביג':'BIG', 'עזריאלי':'Azrieli',
  };
  /** מחזיר את כל הכתיבים לחיפוש: מה שהוקלד + תעתיק אם מוכר */
  function variants(q){
    const k = q.trim().toLowerCase();
    const out = [q.trim()];
    for (const [he, en] of Object.entries(ALIAS)){
      if (k === he.toLowerCase() || (he.length >= 4 && k.includes(he.toLowerCase()))){
        const alt = q.trim().replace(new RegExp(he, 'i'), en).trim();
        if (alt && !out.includes(alt)) out.push(alt);
      }
      if (k === en.toLowerCase() && !out.includes(he)) out.push(he);
    }
    return out.slice(0,2);
  }

  /**
   * Overpass — חיפוש ברדיוס סביב המשתמש לפי שם/מותג.
   * זה הספק היחיד שבאמת עונה על "איפה הסניף הקרוב אליי", כי הוא מחפש
   * בתוך רדיוס ולא מדרג מול כל הארץ. רץ רק כשיש מיקום.
   */
  async function overpass(q, anchor, radius){
    const g = anchor;
    if (!g) throw new Error('אין נקודת ייחוס');
    /* בורח גם מתווי regex וגם ממרכאות — שאילתה שבורה מחזירה 400 */
    const esc = v => v.replace(/[.*+?^${}()|[\]\\"]/g, '\\$&');
    const rx = variants(q).map(esc).join('|');
    const around = `(around:${radius||30000},${g.lat.toFixed(5)},${g.lng.toFixed(5)})`;
    const body = '[out:json][timeout:20];('
      + `nwr["name"~"${rx}",i]${around};`
      + `nwr["brand"~"${rx}",i]${around};`
      + `nwr["name:he"~"${rx}",i]${around};`
      + ');out center 40;';
    const r = await fetch('https://overpass-api.de/api/interpreter',
      { method:'POST', body:'data=' + encodeURIComponent(body),
        headers:{ 'Content-Type':'application/x-www-form-urlencoded' } });
    if (!r.ok) throw new Error('overpass ' + r.status);
    const j = await r.json();
    return (j.elements||[]).map(el => {
      const lat = el.lat != null ? el.lat : (el.center && el.center.lat);
      const lng = el.lon != null ? el.lon : (el.center && el.center.lon);
      const t = el.tags || {};
      const name = t['name:he'] || t.name || t.brand || q;
      const city = t['addr:city'] || t['addr:place'] || t['addr:street'] || '';
      return norm(name, city, lat, lng);
    }).filter(ok);
  }

  /** מסיר כפילויות: אותו שם בתוך 50 מטר */
  /** אותה נקודה בערך = אותו מקום, גם אם הספקים כתבו את השם קצת אחרת */
  function dedupe(list){
    const out = [];
    list.forEach(r => {
      const near = out.find(o =>
        Math.abs(o.lat-r.lat) < 0.0008 && Math.abs(o.lng-r.lng) < 0.0008);
      if (!near) out.push(r);
      else if (!near.city && r.city) near.city = r.city;
    });
    return out;
  }

  const PLACE_CATS = ['place','boundary','landuse','amenity'];
  const PLACE_TYPES = ['city','town','village','hamlet','suburb','neighbourhood',
                       'quarter','isolated_dwelling','municipality','administrative',
                       'locality','farm','residential'];

  /** מאתר יישוב/אזור לפי שם. מחזיר נקודה, או null אם זה לא נשמע כמו מקום. */
  async function geocodeArea(name){
    const url = 'https://nominatim.openstreetmap.org/search'
      + '?format=jsonv2&addressdetails=1&limit=5&accept-language=he&countrycodes=il'
      + '&q=' + encodeURIComponent(name);
    const r = await fetch(url, { headers:{ 'Accept':'application/json' } });
    if (!r.ok) return null;
    const j = await r.json();
    const hit = (j||[]).find(it =>
      PLACE_CATS.includes(it.category) && PLACE_TYPES.includes(it.type));
    if (!hit) return null;
    const a = hit.address || {};
    return { lat:+hit.lat, lng:+hit.lon,
             name: a.village || a.town || a.city || a.suburb ||
                   String(hit.display_name||name).split(',')[0].trim() };
  }

  /**
   * מפרק "סטימצקי גן שמואל" ל-{ what:'סטימצקי', anchor:{גן שמואל} }.
   * מנסה סיומות ארוכות קודם, כדי ש"גן שמואל" ינצח את "שמואל".
   */
  async function splitQuery(q){
    const w = q.trim().split(/\s+/);
    if (w.length < 2) return null;
    for (let n = Math.min(3, w.length - 1); n >= 1; n--){
      const tail = w.slice(w.length - n).join(' ');
      let a = null;
      try { a = await geocodeArea(tail); } catch(e){ a = null; }
      if (a) return { what: w.slice(0, w.length - n).join(' '), anchor:a };
    }
    return null;
  }

  return {
    /**
     * מחפש סביב נקודת ייחוס, לא סביב "כל הארץ".
     * סדר העדיפות לנקודה: שדה "עיר/אזור" → עיר שזוהתה בתוך השאילתה →
     * המיקום הנוכחי שלך. בלי זה חיפוש "סופר פארם" ממרחק 300 ק״מ מהבית
     * מחזיר את מה שהמנוע חושב שהכי "חשוב" בארץ, ולא את מה שביקשת.
     */
    async run(q, areaText){
      let anchor = null, what = q.trim(), src = '';

      if (areaText && areaText.trim()){
        anchor = await geocodeArea(areaText.trim());
        if (!anchor) throw new Error('לא מצאתי את האזור "' + areaText.trim() + '"');
        src = anchor.name;
      }
      if (!anchor){
        const sp = await splitQuery(q);
        if (sp && sp.what){ anchor = sp.anchor; what = sp.what; src = sp.anchor.name; }
      }
      let near = true;
      if (!anchor){
        const g = (typeof Geo !== 'undefined') && Geo.last;
        if (g){ anchor = { lat:g.lat, lng:g.lng, name:'המיקום שלך' }; src = 'המיקום שלך'; }
        else near = false;
      }
      /* אזור מפורש = רדיוס הדוק. מיקום נוכחי = רחב יותר. */
      const explicit = !!(areaText && areaText.trim()) || (src && src !== 'המיקום שלך');
      const radius = explicit ? 20000 : 35000;

      const names = ['סביב האזור','מפות','photon','שבילים'];
      const settled = await Promise.allSettled([
        overpass(what, anchor, radius),
        nominatim(what + (explicit ? ' ' + src : ''), anchor, radius/1000),
        photon(what, anchor),
        israelHiking(q)
      ]);
      const errs = [], all = [];
      settled.forEach((r,i) => {
        if (r.status === 'fulfilled'){
          if (r.value.length) all.push(...r.value);
          else errs.push(names[i] + ': אין תוצאות');
        } else errs.push(names[i] + ': ' + (r.reason && r.reason.message || 'שגיאה'));
      });
      if (!all.length) throw new Error(errs.join(' | '));

      let out = dedupe(all).map(r => ({
        ...r, dist: anchor ? Geo.dist(anchor, r) : null
      }));
      if (anchor){
        out.sort((a,b) => a.dist - b.dist);
        /* כשביקשת אזור מפורש, תוצאה במרחק 80 ק״מ היא רעש ולא תשובה */
        if (explicit){
          const inside = out.filter(r => r.dist <= radius * 1.5);
          if (inside.length) out = inside;
        }
      }
      const provider = anchor
        ? (explicit ? 'סביב ' + src : 'לפי קרבה אליך')
        : 'ללא מיקום — לא ממוין לפי קרבה';
      return { results: out.slice(0,12), provider, anchor, what };
    },
    parseCoords(s){
      const m = String(s).match(/(-?\d{1,3}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)/);
      if (!m) return null;
      const lat = +m[1], lng = +m[2];
      if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
      return { lat, lng };
    },
  };
})();

/* ------------------------------- Alerts --------------------------------- */
const Alerts = (() => {
  let ctx = null;
  const beep = () => {
    if (!Store.all.prefs.snd) return;
    try {
      ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      [0,.18,.36].forEach(off => {
        const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime+off;
        o.type='sine'; o.frequency.setValueAtTime(880,t);
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.28,t+.02);
        g.gain.exponentialRampToValueAtTime(.001,t+.15);
        o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+.16);
      });
    } catch(e){}
  };
  const vibrate = () => {
    if (!Store.all.prefs.vib) return;
    try { navigator.vibrate && navigator.vibrate([220,110,220,110,380]); } catch(e){}
  };
  const system = (title, body) => {
    if (!Store.all.prefs.notif) return;
    try {
      if (typeof Notification!=='undefined' && Notification.permission==='granted')
        new Notification(title, { body, tag:'mesima', dir:'rtl', lang:'he' });
    } catch(e){}
  };
  return {
    async ask(){
      if (typeof Notification === 'undefined') return false;
      try { return (await Notification.requestPermission()) === 'granted'; } catch(e){ return false; }
    },
    fire(item, why, kind){ vibrate(); beep(); system('משימה', item.title); UI.showAlert(item, why, kind); },
  };
})();

/* --------------------------------- Cal ---------------------------------- */
const Cal = (() => {
  const p2 = n => String(n).padStart(2,'0');
  const key = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  /* שלושה סוגים בלבד, מקבילים למשימות-העל. "כללי" היה סתם ברירת מחדל ריקה. */
  /** סוג האירוע — צבע ושם מגיעים ממאגר סוגי האירוע שהמשתמש בונה */
  const type = e => {
    const t = Store.eventType(e && e.typeId);
    return t || { id:'?', name:'ללא סוג', color:'#8a94a6' };
  };

  function atMs(dateKey, hm){
    const [y,m,d] = dateKey.split('-').map(Number);
    const [hh,mi] = (hm||'00:00').split(':').map(Number);
    return new Date(y, m-1, d, hh, mi, 0, 0).getTime();
  }
  function startMs(ev){ return atMs(ev.date, ev.time); }
  /** סיום האירוע.
      שעת סיום קטנה משעת ההתחלה = האירוע חוצה חצות (שמירה 22:00–02:00),
      ואז הסיום הוא למחרת. בלי זה משמרת לילה נספרה כשעה אחת. */
  function endMs(ev){
    const s = startMs(ev);
    let e = atMs(ev.endDate || ev.date, ev.end || ev.time);
    if (e <= s && !ev.endDate) e += 864e5;
    if (e <= s) e = s + 60*60000;
    return e;
  }
  function durLabel(ev){
    const mins = Math.round((endMs(ev) - startMs(ev)) / 60000);
    if (ev.endDate && ev.endDate !== ev.date){
      const days = Math.round((atMs(ev.endDate,'00:00') - atMs(ev.date,'00:00')) / 864e5) + 1;
      return days + ' ימים';
    }
    if (mins < 60) return mins + ' דק׳';
    const h = Math.floor(mins/60), m = mins%60;
    return h + ' שע׳' + (m ? ' ' + m : '');
  }
  function stamp(ms){
    const d = new Date(ms);
    return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00';
  }
  /* קובץ ICS – אנדרואיד מציע לפתוח אותו ביומן של הטלפון */
  function ics(events){
    const esc = s => String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
    const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//mesima//HE','CALSCALE:GREGORIAN'];
    events.forEach(ev => {
      const s = startMs(ev), e = endMs(ev);
      L.push('BEGIN:VEVENT', 'UID:'+ev.id+'@mesima', 'DTSTAMP:'+stamp(Date.now()),
             'DTSTART:'+stamp(s), 'DTEND:'+stamp(e), 'SUMMARY:'+esc(ev.title));
      if (ev.note) L.push('DESCRIPTION:'+esc(ev.note));
      if (ev.remindMin >= 0)
        L.push('BEGIN:VALARM','TRIGGER:-PT'+(ev.remindMin||0)+'M','ACTION:DISPLAY',
               'DESCRIPTION:'+esc(ev.title),'END:VALARM');
      L.push('END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.join('\r\n');
  }
  function gcal(ev){
    const s = startMs(ev), e = endMs(ev);
    const q = new URLSearchParams({ action:'TEMPLATE', text:ev.title,
      dates: stamp(s)+'/'+stamp(e), details: ev.note||'', ctz:'Asia/Jerusalem' });
    return 'https://calendar.google.com/calendar/render?' + q.toString();
  }
  function monthGrid(year, month){
    const first = new Date(year, month, 1);
    const start = new Date(first); start.setDate(1 - first.getDay());  /* ראשון */
    const cells = [];
    for (let i=0;i<42;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      cells.push({ date:d, key:key(d), out:d.getMonth()!==month });
      if (i>=34 && d.getMonth()!==month && d.getDay()===6) break;
    }
    return cells;
  }
  /** ראשון עד שבת של השבוע שבו נמצא התאריך */
  function weekOf(k){
    const [y,m,d] = k.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    dt.setDate(dt.getDate() - dt.getDay());
    return Array.from({length:7}, (_,i)=>{
      const x = new Date(dt); x.setDate(dt.getDate()+i); return key(x);
    });
  }
  return { key, MONTHS, type, startMs, endMs, durLabel, ics, gcal, monthGrid, weekOf };
})();

/* -------------------------------- Modal --------------------------------- */
/* גיליון תחתון כללי. משמש לבורר משימות, לסגירת חשבון ולעריכת פריט. */
const Modal = (() => {
  const $ = x => document.querySelector(x);
  let onClose = null;
  function open({ title, body, buttons, close }){
    $('#mTitle').textContent = title || '';
    /* מחליפים את הגוף באלמנט חדש כדי להרוג מאזינים ישנים.
       בלי זה כל פתיחה מוסיפה מאזין נוסף לאותו אלמנט, וקליק אחד היה מפעיל
       גם את המאזינים של כל המודאלים הקודמים — כולל מחיקות של משימות אחרות. */
    const oldBody = $('#mBody');
    const fresh = oldBody.cloneNode(false);
    oldBody.replaceWith(fresh);
    fresh.innerHTML = body || '';
    $('#mFoot').innerHTML = (buttons||[]).map((b,i)=>
      `<button class="btn ${b.kind||'s'}" data-mb="${i}">${b.label}</button>`).join('');
    $('#mFoot').querySelectorAll('[data-mb]').forEach(el=>{
      el.addEventListener('click', ()=> buttons[+el.dataset.mb].act?.());
    });
    onClose = close || null;
    $('#modal').classList.add('on');
  }
  function shut(){ $('#modal').classList.remove('on'); $('#mBody').innerHTML=''; onClose?.(); onClose=null; }
  return { open, shut, get body(){ return $('#mBody'); } };
})();

/* --------------------------------- Plan --------------------------------- */
/* עוזרי תכנון יומי: מיזוג אירועי יומן עם משימות שתוכננו ליום. */
const Plan = (() => {
  const p2 = n => String(n).padStart(2,'0');
  const key = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  const shift = (k, days) => {
    const [y,m,d] = k.split('-').map(Number);
    const dt = new Date(y, m-1, d); dt.setDate(dt.getDate()+days); return key(dt);
  };
  const today = () => key(new Date());
  const label = k => {
    if (k === today()) return 'היום';
    if (k === shift(today(), 1)) return 'מחר';
    if (k === shift(today(), -1)) return 'אתמול';
    const [y,m,d] = k.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('he-IL',{weekday:'long'});
  };
  const longDate = k => {
    const [y,m,d] = k.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
  };
  /** כל מה שמתוכנן ליום, ממוין: אירועים לפי שעה, אחריהם משימות ללא שעה. */
  function agenda(date){
    const rows = [];
    Store.events(date).forEach(e => rows.push({ kind:'event', at:e.time, ref:e }));
    Store.plannedFor(date).forEach(t => {
      const at = (t.reminder && t.reminder.type === 'time') ? t.reminder.at : null;
      rows.push({ kind:'task', at, ref:t });
    });
    /* הרגלים יומיים נכנסים לבד — בלי לתכנן אותם ידנית כל יום */
    Store.habitsFor(date).forEach(t => {
      const now = new Date().toTimeString().slice(0,5);
      /* מוצג בשעת התזכורת הבאה שעוד לא עברה; אחרת בראשונה */
      const at = t.repeat.times.find(x => x >= now) || t.repeat.times[0];
      rows.push({ kind:'habit', at, ref:t });
    });
    rows.sort((a,b) => {
      if (a.at && b.at) return a.at.localeCompare(b.at);
      if (a.at) return -1;
      if (b.at) return 1;
      return 0;
    });
    return rows;
  }
  return { key, shift, today, label, longDate, agenda };
})();

/* -------------------------------- Track --------------------------------- */
/* בדיקת מצב יציאה לפריטי "משאלות".
   ספרים: Google Books פתוח וללא מפתח. משחקים: אין API חינמי ויציב שעובד
   מהדפדפן, ולכן שם זו בדיקה ידנית דרך קישור — ואומרים את זה במפורש. */
const Track = (() => {
  async function books(title){
    const url = 'https://www.googleapis.com/books/v1/volumes?maxResults=3&q=' +
                encodeURIComponent('intitle:' + title);
    const r = await fetch(url);
    if (!r.ok) throw new Error('books ' + r.status);
    const j = await r.json();
    const v = (j.items || [])[0];
    if (!v) throw new Error('לא נמצא');
    const i = v.volumeInfo || {};
    return { title:i.title || title, date:i.publishedDate || '',
             by:(i.authors||[]).join(', '), img:(i.imageLinks||{}).thumbnail || '' };
  }
  const searchUrl = (q, kind) => kind === 'game'
    ? 'https://www.google.com/search?q=' + encodeURIComponent(q + ' release date game')
    : 'https://www.google.com/search?q=' + encodeURIComponent(q + ' תאריך יציאה');
  return { books, searchUrl };
})();

/* ------------------------------- Native --------------------------------- */
/* קיים רק בתוך ה-APK. בדפדפן A הוא undefined והכול ממשיך לעבוד כרגיל. */
const Native = (() => {
  const A = () => window.MesimaNative;
  let syncT = null;

  /**
   * גדר אחת לכל (מקום ראשי × עיכוב), לא אחת לכל משימה.
   *
   * הסיבה: GPS של טלפון מדויק ל-20–50 מטר ליד מבנים, ואנדרואיד עצמו לא מתחייב
   * מתחת ל-100 מטר. גדר על "משרד" בתוך בסיס פשוט לא יכולה לירות אמין.
   * לכן הגדר יושבת על המקום הראשי ברדיוס גדול, ותת-המקומות משמשים רק
   * לניווט בתוך האפליקציה. בונוס: התראה אחת בכניסה במקום שש בזמן הליכה.
   */
  function fenceList(){
    const groups = new Map();
    Store.all.tasks
      .filter(t => !t.archived && t.reminder && t.reminder.type === 'place')
      .forEach(t => {
        const sub  = Store.place(t.reminder.placeId); if (!sub) return;
        const root = Store.placeRoot(sub.id);         if (!root) return;
        const delay = t.reminder.delayMin || 0;
        const key = root.id + '|' + delay;
        if (!groups.has(key)) groups.set(key, { root, delay, items: [] });
        groups.get(key).items.push({ t, sub });
      });

    return [...groups.entries()].map(([key, g]) => {
      const n = g.items.length;
      let title;
      if (n === 1){
        const { t, sub } = g.items[0];
        title = t.title + (sub.id !== g.root.id ? ' · ' + sub.name : '');
      } else {
        const spots = [...new Set(g.items.map(x => x.sub.name))].filter(x => x !== g.root.name);
        title = n + ' משימות ב' + g.root.name + (spots.length ? ' · ' + spots.slice(0,3).join(', ') : '');
      }
      return { id:'g_'+key, lat:g.root.lat, lng:g.root.lng, radius:g.root.radius,
               delayMin:g.delay, title, place:g.root.name };
    }).slice(0, 95);   /* מגבלת מערכת: 100 גדרים לאפליקציה */
  }

  return {
    get on(){ return !!A(); },
    status(){ try { return A() ? JSON.parse(A().status()) : null; } catch(e){ return null; } },
    /* נדחה מעט כדי לא לרשום מחדש על כל הקלדה */
    sync(){
      if (!A()) return;
      clearTimeout(syncT);
      syncT = setTimeout(() => { try { A().syncGeofences(JSON.stringify(fenceList())); } catch(e){} }, 600);
    },
    fenceCount(){ return fenceList().length; },
    askLocation(){ try { A().requestLocation(); } catch(e){} },
    askNotifications(){ try { A().requestNotifications(); } catch(e){} },
    battery(){ try { A().requestBatteryExemption(); } catch(e){} },
    samsung(){ try { A().openSamsungSleepingApps(); } catch(e){} },
    appSettings(){ try { A().openAppSettings(); } catch(e){} },
    showAlarms(){ try { A().showAlarms(); } catch(e){} },
    setAlarm(at, message){
      if (!A()) return false;
      const [h,m] = String(at).split(':').map(Number);
      try { A().setAlarm(h|0, m|0, message, true); return true; } catch(e){ return false; }
    },
    addEvent(ev){
      if (!A()) return false;
      const b = Cal.startMs(ev), e = Cal.endMs(ev);
      try { A().addCalendarEvent(ev.title, b, e, ev.note||'', ''); return true; } catch(x){ return false; }
    },
    /* ה-WebView לא יודע להוריד blob, ולכן שמירה עוברת דרך אנדרואיד */
    save(name, text, mime){
      if (!A()) return false;
      try { A().saveText(name, text, mime||'text/plain'); return true; } catch(e){ return false; }
    },
    setSource(u){ try { A().setSourceUrl(u); } catch(e){} },
    checkUpdate(){ try { A().checkUpdate(); } catch(e){} },
    applyUpdate(){ try { A().applyUpdate(); } catch(e){} },
  };
})();

/* --------------------------------- UI ----------------------------------- */
/* משימה 2.0 — רינדור בלבד. כל ההיגיון יושב ב-Store וב-Engine. */
const UI = (() => {
  const $  = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const CAT   = { army:'צבא', home:'בית', free:'אישי' };
  const DAYL  = ['א','ב','ג','ד','ה','ו','ש'];
  /* לוח צבעים לסוגי אירוע — נבחר לעבוד יחד על רקע כהה */
  const PALETTE = ['#7aa2f7','#8bcaa8','#e0b57a','#e0787a','#b48ead','#7fc8d8',
                   '#c3a6e0','#9fbf7a','#dd9a7a','#8fb8d6','#d68fb0','#8a94a6'];

  /* ---- מצב תצוגה ---- */
  let section  = 'today';      /* today | tasks | library */
  let screen   = null;         /* notes | lists | archive | places | settings */
  let tview    = 'day';        /* day | d3 | week | month */
  let filter   = 'all';
  let taskQ    = '';
  let onlyUnplanned = false;
  let selDate  = Plan.today();
  let calY, calM;
  { const [y,m] = selDate.split('-').map(Number); calY = y; calM = m - 1; }
  let deferred = false, alertItem = null;
  let openList = null, listKind = 'simple', itemMore = false;
  let openNote = null, noteQ = '';
  let addKind = 'search';      /* טופס הוספת מקום */

  const SCREEN_TITLE = { notes:'הערות', lists:'קניות', archive:'ארכיון',
                         places:'מקומות', settings:'הגדרות' };
  const SEC_TITLE    = { today:'היום', tasks:'משימות', library:'ספרייה' };

  const fmtM = m => m < 1000 ? Math.round(m)+' מ׳' : (m/1000).toFixed(1)+' ק״מ';
  const fmtDate = ts => {
    const d = new Date(ts), n = new Date();
    const hm = d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    if (d.toDateString() === n.toDateString()) return 'היום ' + hm;
    if (new Date(n-864e5).toDateString() === d.toDateString()) return 'אתמול ' + hm;
    return d.toLocaleDateString('he-IL',{day:'numeric',month:'short'}) + ' ' + hm;
  };
  const longDate = k => {
    const [y,m,d] = k.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
  };
  const nowHM = () => new Date().toTimeString().slice(0,5);

  /* ---------- מצב האתר: האם בכלל מותר לבקש מיקום? ---------- */
  function originState(){
    const p = location.protocol;
    const opaque = (p==='content:' || p==='file:' || p==='blob:');
    const secure = (window.isSecureContext !== false) && !opaque;
    return { protocol:p, opaque, secure, canGeo: secure && !!navigator.geolocation };
  }
  function originWarn(){
    const st = originState();
    if (st.canGeo || Native.on) return '';
    return `<div class="notice warn"><b>המיקום חסום, וזה לא באפליקציה.</b><br>
      הקובץ נפתח מכתובת ${esc(st.protocol)}// וכרום אוסר גישה למיקום מכתובת כזאת.
      כל השאר עובד רגיל.</div>`;
  }

  const cleanSrc = u => String(u||'').replace(/([?&])t=\d+&?/g,'$1').replace(/[?&]$/,'');
  const bustSrc  = u => { const c = cleanSrc(u);
                          return c + (c.includes('?') ? '&' : '?') + 't=' + Date.now(); };

  /* ====================================================================
     תיאורי משימה — טקסט, לא אייקונים (סעיף 63)
     ==================================================================== */
  function whereLabel(r){
    const p = Store.place(r.placeId);
    if (!p) return 'מקום שנמחק';
    const root = Store.placeRoot(p.id);
    const name = (root && root.id !== p.id) ? root.name + ' · ' + p.name : p.name;
    return name + (r.delayMin > 0 ? ' · אחרי ' + r.delayMin + ' דק׳' : '');
  }
  /** שורת המטא של משימה: מה שצריך לדעת, לא כל מה שידוע (סעיף 12) */
  function taskMeta(t, opts){
    opts = opts || {};
    const out = [];
    if (!opts.noCat) out.push(CAT[t.mission]);
    if (t.kind === 'long') out.push('ארוך טווח');
    const r = t.reminder;
    if (r && r.type === 'time' && !opts.noTime) out.push('עד ' + r.at);
    if (r && r.type === 'place') out.push(whereLabel(r));
    if (r && r.type === 'trip')  out.push('אחרי ' + r.km + ' ק״מ נסיעה');
    if (Store.isHabit(t) && !opts.noRepeat) out.push(repeatLabel(t.repeat));
    if (t.planned && !opts.noPlan && t.planned !== selDate) out.push(Plan.label(t.planned));
    const kids = Store.children(t.id).length;
    if (kids && !opts.noKids) out.push(kids + (kids === 1 ? ' תת-משימה' : ' תת-משימות'));
    return out.filter(Boolean).join(' · ');
  }
  function repeatLabel(rep){
    if (!rep) return '';
    const d = rep.days.slice().sort();
    let days;
    if (d.length === 7) days = 'כל יום';
    else if (d.join() === '0,1,2,3,4,5') days = 'א׳–ו׳';
    else if (d.join() === '0,1,2,3,4') days = 'א׳–ה׳';
    else days = d.map(x => DAYL[x]).join('׳ ') + '׳';
    return days;
  }

  /* ====================================================================
     היום
     ==================================================================== */
  function renderToday(){
    $$('#tvModes button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === tview));
    const box = $('#todayBody');
    if (tview === 'day')   return void (box.innerHTML = dayView(selDate));
    if (tview === 'd3')    return void (box.innerHTML = rangeView(3));
    if (tview === 'week')  return void (box.innerHTML = rangeView(7));
    box.innerHTML = monthView();
  }

  /** מה שקורה עכשיו — מוצג רק אם באמת יש משהו (סעיף 10) */
  function nowBlock(date){
    if (date !== Plan.today()) return '';
    const parts = [];
    const hm = nowHM();

    const ev = Store.events(date).find(e => e.time <= hm &&
      new Date(Cal.endMs(e)).toTimeString().slice(0,5) > hm);
    if (ev){
      const end = new Date(Cal.endMs(ev));
      const eh = String(end.getHours()).padStart(2,'0')+':'+String(end.getMinutes()).padStart(2,'0');
      parts.push(`<div class="row" style="border:0;padding:4px 0">
        <div class="when">${esc(ev.time)}<span class="e">${eh}</span></div>
        <div class="bd"><div class="t">${esc(ev.title)}</div></div></div>`);
    }

    if (Geo.last){
      const at = Store.topPlaces().find(p => Geo.dist(Geo.last, p) <= p.radius);
      if (at){
        const ids = new Set([at.id, ...Store.subPlaces(at.id).map(p => p.id)]);
        const here = Store.all.tasks.filter(t => !t.archived && t.reminder &&
          t.reminder.type === 'place' && ids.has(t.reminder.placeId));
        if (here.length){
          const list = here.slice()
            .map(t => ({ t, sub: Store.place(t.reminder.placeId) }))
            .sort((a,b) => Geo.dist(Geo.last, a.sub) - Geo.dist(Geo.last, b.sub));
          parts.push(`<div style="padding:2px 0">
            <div class="t" style="margin-bottom:8px">אתה ב${esc(at.name)}</div>
            ${list.map(({t,sub}) => `<div class="row" data-id="${t.id}" style="padding:9px 0">
                <button class="cb" data-act="done"></button>
                <div class="bd"><div class="t" style="font-size:14px">${esc(t.title)}</div>
                  ${sub.id !== at.id ? `<div class="m">${esc(sub.name)}</div>` : ''}</div>
              </div>`).join('')}</div>`);
        }
      }
    }
    if (!parts.length) return '';
    return `<div class="nowbox" id="nowBox"><div class="lb">עכשיו</div>${parts.join('')}</div>`;
  }

  /** משימות שהשעה שלהן עברה ועדיין פתוחות. בלי דרמה, בלי הזזה אוטומטית. */
  function overdueBlock(date){
    if (date !== Plan.today()) return '';
    const hm = nowHM();
    const late = Store.plannedFor(date).filter(t =>
      t.reminder && t.reminder.type === 'time' && t.reminder.at < hm);
    if (!late.length) return '';
    return `<h2 class="sh">עבר הזמן</h2>` + late.map(t => `
      <div class="row" data-id="${t.id}">
        <button class="cb" data-act="done"></button>
        <div class="bd"><div class="t">${esc(t.title)}</div>
          <div class="m">היה מתוכנן ל-${esc(t.reminder.at)}</div></div>
        <span class="chev" data-act="open">‹</span>
      </div>`).join('');
  }

  /** ציר זמן אחד — אירועים, משימות והרגלים ביחד (סעיף 10) */
  function dayView(date){
    const isToday = date === Plan.today();
    const hm = nowHM();
    const rows = [];

    Store.events(date).forEach(e => rows.push({ at:e.time, kind:'event', ref:e }));

    Store.plannedFor(date).forEach(t => {
      const at = (t.reminder && t.reminder.type === 'time') ? t.reminder.at : null;
      if (isToday && at && at < hm) return;              /* מוצג ב"עבר הזמן" */
      if (t.eventId && !at && Store.event(t.eventId)) return;  /* מקופל לתוך האירוע */
      rows.push({ at, kind:'task', ref:t });
    });

    Store.habitsFor(date).forEach(t => {
      if (Store.habitFull(t, date)) return;              /* נסגר להיום */
      const next = t.repeat.times.find(x => x >= hm);
      rows.push({ at: isToday ? (next || t.repeat.times[0]) : t.repeat.times[0],
                  kind:'habit', ref:t });
    });

    const timed   = rows.filter(r => r.at).sort((a,b) => a.at.localeCompare(b.at));
    const notimed = rows.filter(r => !r.at);

    let body = '';
    let drawnNow = false;
    timed.forEach(r => {
      if (isToday && !drawnNow && r.at > hm){
        drawnNow = true;
        body += `<div class="nowline"><span class="lbl">${hm}</span><span class="ln"></span></div>`;
      }
      body += r.kind === 'event' ? eventRow(r.ref) : taskRow(r.ref, r.at, date);
    });

    let out = originWarn() + nowBlock(date) + overdueBlock(date);
    if (body) out += `<h2 class="sh">${isToday ? 'במהלך היום' : 'לוח הזמנים'}</h2>` + body;
    if (notimed.length){
      out += `<h2 class="sh">ללא שעה</h2>` +
             notimed.map(r => taskRow(r.ref, null, date)).join('');
    }
    if (!body && !notimed.length && !nowBlock(date) && !overdueBlock(date)){
      out += emptyToday(date);
    }
    return `<div class="big">${esc(Plan.label(date))}</div>
            <div class="sub">${esc(longDate(date))}</div>` + out;
  }

  function emptyToday(date){
    const nx = Plan.shift(date, 1);
    const n  = Store.events(nx).length + Store.plannedFor(nx).length;
    return `<div class="empty">
      <div class="h">${date === Plan.today() ? 'היום פנוי' : 'היום הזה פנוי'}</div>
      <div class="d">אין שום דבר מתוכנן.</div>
      <button class="btn" data-act="add">+ הוסף משהו</button>
      ${n ? `<div class="m" style="margin-top:22px;color:var(--muted2)">מחר יש ${n} דברים</div>` : ''}
    </div>`;
  }

  function taskRow(t, at, date){
    const hab = Store.isHabit(t);
    const done = hab && Store.habitFull(t, date || Plan.today());
    return `<div class="row" data-id="${t.id}">
      ${at ? `<div class="when">${esc(at)}</div>` : ''}
      <button class="cb${hab?' hab':''}${done?' on':''}" data-act="done">✓</button>
      <div class="bd"><div class="t">${esc(t.title)}</div>
        ${(() => { const m = taskMeta(t,{noPlan:true,noKids:true,noTime:!!at});
                   return m ? `<div class="m">${esc(m)}</div>` : ''; })()}
      </div>
      <span class="chev" data-act="open">‹</span>
    </div>`;
  }

  /** אירוע. משימות קשורות ללא שעה משלהן מקופלות פנימה (סעיף 13) */
  function eventRow(e){
    const ty  = Cal.type(e);
    const end = new Date(Cal.endMs(e));
    const eh  = String(end.getHours()).padStart(2,'0')+':'+String(end.getMinutes()).padStart(2,'0');
    const linked = Store.tasksForEvent(e.id)
      .filter(t => !(t.reminder && t.reminder.type === 'time'));
    const meta = [ty.name, linked.length ? linked.length + ' דברים להכין' : ''].filter(Boolean).join(' · ');
    return `<div class="evrow" data-ev="${e.id}">
      <div class="when">${esc(e.time)}<span class="e">${eh}</span></div>
      <span class="bar" style="background:${ty.color}"></span>
      <div class="bd">
        <div class="t">${esc(e.title)}</div>
        <div class="m"><span class="edot" style="background:${ty.color}"></span>${esc(meta)}</div>
        ${e.note ? `<div class="m" style="color:var(--muted)">${esc(e.note)}</div>` : ''}
      </div>
      <span class="chev" data-act="openEv">‹</span>
    </div>`;
  }

  /** 3 ימים / שבוע — סקירה בלבד, לא ציר זמן מלא (סעיפים 14–15) */
  function rangeView(n){
    const days = [];
    for (let i = 0; i < n; i++) days.push(Plan.shift(selDate, i));
    const cap = n === 3 ? 3 : 2;
    return days.map(k => {
      const evs = Store.events(k);
      const tsk = Store.plannedFor(k);
      const hab = Store.habitsFor(k).filter(t => !Store.habitFull(t, k));
      const items = [...evs.map(e => e.title), ...hab.map(t => t.title), ...tsk.map(t => t.title)];
      const total = items.length;
      return `<div style="margin-bottom:6px">
        <button class="row" data-day="${k}" style="width:100%;text-align:start">
          <div class="bd">
            <div class="t">${esc(Plan.label(k))}</div>
            ${total
              ? `<div class="m">${items.slice(0,cap).map(esc).join(' · ')}${
                  total > cap ? ' · ועוד ' + (total-cap) : ''}</div>`
              : `<div class="m">פנוי</div>`}
          </div>
          <span class="chev">‹</span>
        </button></div>`;
    }).join('');
  }

  /** חודש — מינימלי. מספר ונקודות בלבד (סעיף 16) */
  function monthView(){
    const todayKey = Plan.today();
    const cells = Cal.monthGrid(calY, calM);
    return `
      <div class="row" style="border:0;padding:0 0 12px;align-items:center">
        <button class="hbtn" data-mo="-1">›</button>
        <div class="bd" style="text-align:center"><div class="t">${Cal.MONTHS[calM]} ${calY}</div></div>
        <button class="hbtn" data-mo="1">‹</button>
      </div>
      <div class="mgrid">${DAYL.map(d => `<div class="wd">${d}</div>`).join('')}</div>
      <div class="mgrid" id="mGrid">${cells.map(c => {
        const evs = Store.events(c.key);
        const tsk = Store.plannedFor(c.key).length;
        const pips = evs.slice(0,3).map(e =>
          `<span class="pip" style="background:${Cal.type(e).color}"></span>`).join('')
          + (tsk ? `<span class="pip" style="background:var(--muted2)"></span>` : '');
        return `<button class="day${c.out?' out':''}${c.key===todayKey?' today':''}"
          data-day="${c.key}" aria-selected="${c.key===selDate}">
          <span>${c.date.getDate()}</span><div class="pips">${pips}</div></button>`;
      }).join('')}</div>
      <div class="rule"></div>
      <div class="t" style="margin-bottom:10px">${esc(longDate(selDate))}</div>
      <div id="mDay">${monthDayList(selDate)}</div>`;
  }
  function monthDayList(date){
    const evs = Store.events(date), tsk = Store.plannedFor(date);
    const hab = Store.habitsFor(date).filter(t => !Store.habitFull(t, date));
    if (!evs.length && !tsk.length && !hab.length)
      return `<div class="dim small" style="padding:6px 0">אין כלום ביום הזה.</div>`;
    return evs.map(eventRow).join('') +
           [...hab, ...tsk].map(t => taskRow(t, null, date)).join('');
  }

  /* ====================================================================
     משימות
     ==================================================================== */
  function renderTasks(){
    $$('#tFilters button').forEach(b => b.setAttribute('aria-selected', b.dataset.f === filter));
    const box = $('#tasksBody');
    const q = taskQ.trim().toLowerCase();

    if (q){
      const hits = Store.active(filter).filter(t =>
        t.title.toLowerCase().includes(q) || (t.note||'').toLowerCase().includes(q));
      box.innerHTML = hits.length
        ? `<h2 class="sh">${hits.length} תוצאות</h2>` + hits.map(t => `
            <div class="row" data-id="${t.id}">
              <div class="bd"><div class="t">${esc(t.title)}</div>
                <div class="m">${esc(path(t) || taskMeta(t))}</div></div>
              <span class="chev" data-act="open">‹</span>
            </div>`).join('')
        : `<div class="empty"><div class="h">לא נמצא</div>
             <div class="d">אין משימה שמתאימה ל"${esc(taskQ)}".</div></div>`;
      return;
    }

    let roots = Store.children(null, filter);
    if (onlyUnplanned) roots = roots.filter(t => !t.planned && !Store.isHabit(t));
    if (!roots.length){ box.innerHTML = emptyTasks(); return; }

    /* קיבוץ לפי צבע הקטגוריה — דרך סדר בלבד, בלי כותרות ובלי קווים מפרידים.
       צבעים מתחלפים לאורך הרשימה מסיחים את העין. בתוך כל קטגוריה,
       פריטים ארוכי-טווח קודמים. */
    const ORDER = ['army','home','free'];
    roots.sort((a,b) => {
      const c = ORDER.indexOf(a.mission) - ORDER.indexOf(b.mission);
      if (c) return c;
      const k = (a.kind === 'long' ? 0 : 1) - (b.kind === 'long' ? 0 : 1);
      if (k) return k;
      return (b.createdAt||0) - (a.createdAt||0);
    });
    let out = roots.map((t, i) => {
      const gap = i > 0 && roots[i-1].mission !== t.mission;
      return card(t, gap);
    }).join('');

    const un = Store.active(filter).filter(t => !t.planned && !t.parentId && !Store.isHabit(t)).length;
    if (un) out += `<button class="txtbtn" id="unschd">${
      onlyUnplanned ? '‹ חזרה לכל המשימות' : un + ' משימות בלי תאריך'}</button>`;
    box.innerHTML = out;
  }

  function path(t){
    const names = []; let p = t.parentId ? Store.task(t.parentId) : null, g = 0;
    while (p && g++ < 8){ names.unshift(p.title); p = p.parentId ? Store.task(p.parentId) : null; }
    return names.join(' › ');
  }

  function emptyTasks(){
    return `<div class="empty">

  }

  /** כרטיס משימה — הקטגוריה צובעת את כל המשטח, בגוון טונלי (סעיפים 22–23) */
  function card(t, gap){
    const kids = Store.children(t.id);
    const open = !t.collapsed;
    const hab  = Store.isHabit(t);
    const doneToday = hab && Store.habitFull(t, Plan.today());
    const meta = taskMeta(t, { noCat:true, noKids:true });
    return `<div class="tcard ${t.mission}${gap ? ' gap' : ''}" data-id="${t.id}">
      <div class="thead">
        ${t.kind === 'long'
          ? '<span class="cb" style="border-style:dotted;border-color:currentColor;opacity:.45"></span>'
          : `<button class="cb${hab?' hab':''}${doneToday?' on':''}" data-act="done">✓</button>`}
        <div class="bd">
          <div class="ttl">${esc(t.title)}</div>
          <div class="tmeta"><span class="catname">${CAT[t.mission]}</span>${meta ? ' · ' + esc(meta) : ''}</div>
          ${t.note ? `<div class="tnote">${esc(t.note)}</div>` : ''}
        </div>
        <button class="hbtn" data-act="menu" style="width:28px;height:28px;font-size:15px">⋯</button>
      </div>
      ${kids.length ? `
        <button class="twist" data-act="twist" aria-expanded="${open}">
          <span class="ar">‹</span>
          <span>${kids.length} ${kids.length===1?'תת-משימה':'תת-משימות'}</span>
        </button>
        ${open ? `<div class="kids">${kids.map(kidRow).join('')}</div>` : ''}` : ''}
    </div>`;
  }

  /** תת-משימה: כותרת בלבד. ההערה נחשפת רק כשפותחים אותה (סעיף 35) */
  function kidRow(t){
    const kids = Store.children(t.id);
    const hab  = Store.isHabit(t);
    const doneToday = hab && Store.habitFull(t, Plan.today());
    const meta = taskMeta(t, { noCat:true, noKids:true });
    return `<div class="krow" data-id="${t.id}">
      <button class="cb${hab?' hab':''}${doneToday?' on':''}" data-act="done"
              style="width:18px;height:18px;font-size:10px">✓</button>
      <div class="kt">${esc(t.title)}
        ${meta ? `<div class="km">${esc(meta)}</div>` : ''}
        ${kids.length ? `<button class="km" data-act="twist" style="text-align:start">
            ${t.collapsed ? '‹ ' : '⌄ '}${kids.length} בפנים</button>
          ${!t.collapsed ? `<div class="kids">${kids.map(kidRow).join('')}</div>` : ''}` : ''}

      <button class="hbtn" data-act="menu" style="width:24px;height:24px;font-size:14px">⋯</button>

  /** מסלול מומלץ בין החנויות */
  function routeBlock(){
    const names = [...new Set(Store.openItems().map(i => i.where).filter(Boolean))];
    const pts = Store.all.places.filter(p => names.includes(p.name));
    if (names.length >= 2 && pts.length < 2){
      const missing = names.filter(n => !Store.placeByName(n));
      return `<div class="notice">רוצה <b>מסלול מומלץ</b> בין החנויות? שמור אותן כמקומות
        (תפריט ⋯ ← מקומות), באותו שם בדיוק.
        ${missing.length ? '<br>עוד לא שמורות: ' + missing.slice(0,4).map(esc).join(' · ') : ''}</div>`;
    }
    if (!Geo.last || pts.length < 2) return '';
    const { stops, total } = Geo.route(Geo.last, pts);
    const mins = Math.round(total/1000/25*60) + stops.length*8;
    return `<h2 class="sh">מסלול מומלץ · ${(total/1000).toFixed(1)} ק״מ · כ-${mins} דק׳</h2>
      <div class="stops">${stops.map((st,i) => `<div class="stop">
        <span class="num">${i+1}</span><span class="sn">${esc(st.name)}</span>
        <span class="sd2">${fmtM(st.leg)}</span>
        <a class="link" href="https://waze.com/ul?ll=${st.lat},${st.lng}&navigate=yes"
           target="_blank" rel="noopener">ניווט</a></div>`).join('')}</div>
      <div class="rule"></div>`;
  }

      </div>
      ${l.kind === 'wish'
        ? `<div style="margin-bottom:6px"><label>תאריך יציאה (אם ידוע)</label>
             <input type="date" id="iRel"></div>`
        : `<div style="margin-bottom:6px"><label>איפה</label>
             <input type="text" id="iWhere" placeholder="שם החנות" list="storeList" autocomplete="off">
             <datalist id="storeList"></datalist></div>`}
      <button class="txtbtn" id="iMore" aria-expanded="${itemMore}">${itemMore?'⌄':'‹'} קישור או תמונה</button>
      <div id="iExtra" ${itemMore ? '' : 'hidden'}>

        <button class="btn wide" id="iPic" style="margin-top:0">בחר תמונה</button>

        : ''}
      <button class="btn d wide" id="lDelete">מחיקת הרשימה</button>`;

    const dl = $('#storeList');
    if (dl) dl.innerHTML = [...new Set(Store.openItems().map(i => i.where).filter(Boolean))]
      .map(w => `<option value="${esc(w)}">`).join('');
  }

  /* ====================================================================

  function noteText(html){
    const d = document.createElement('div');
    d.innerHTML = html || '';
    d.querySelectorAll('script,style').forEach(x => x.remove());
    d.querySelectorAll('p,div,li,h1,h2,h3,br,blockquote,tr').forEach(x => x.append(' '));
    return (d.textContent || '').replace(/\s+/g,' ').trim();
  }
  function firstImg(html){
    const m = /<img[^>]+src="([^"]+)"/i.exec(html || '');
    return m ? m[1] : '';

  function renderNotes(){
    const idx = $('#notesIndex'), ed = $('#noteEdit');
    if (openNote && Store.note(openNote)){ idx.hidden = true; ed.hidden = false; return; }
    openNote = null; idx.hidden = false; ed.hidden = true;

    const q = noteQ.trim().toLowerCase();
    const all = Store.notes();
    const list = !q ? all : all.filter(n =>
      (n.title||'').toLowerCase().includes(q) || noteText(n.html).toLowerCase().includes(q));
    const el = $('#notesList');
    if (!list.length){
      el.innerHTML = q
        ? `<div class="empty"><div class="h">לא נמצא</div>
             <div class="d">אין הערה שמתאימה לחיפוש.</div></div>`

        <button class="hbtn" data-act="nMenu" style="width:26px;height:26px;font-size:14px">⋯</button>
      </div>`;

  /* ====================================================================

  function renderChrome(){
    $('#hTitle').textContent = screen ? SCREEN_TITLE[screen] : SEC_TITLE[section];
    $$('#nav button').forEach(b =>
      b.setAttribute('aria-selected', !screen && b.dataset.s === section));

    const id = screen ? 's-' + screen : 's-' + section;
    const el = document.getElementById(id);
    if (el) el.classList.add('on');

    const g = $('#gps');
    g.classList.toggle('on', Geo.on && !!Geo.last);
    $('#gpsTxt').textContent = !Geo.on ? 'GPS כבוי'
      : (Geo.last ? (Geo.trip.meters > 200 ? (Geo.trip.meters/1000).toFixed(1) + ' ק״מ' : 'מיקום פעיל')
                  : 'מחפש…');

    /* כפתור ההוספה קיים רק איפה שיש משמעות ליצירה (סעיף 44) */
    const fabOn = (!screen && (section === 'today' || section === 'tasks')) ||
                  (screen === 'notes' && !openNote) || (screen === 'lists');
    $('#fab').hidden = !fabOn;
  }

  function typing(){
    const a = document.activeElement;
    if (!a) return false;
    if (a.tagName === 'TEXTAREA' || a.isContentEditable) return true;
    if (a.tagName !== 'INPUT') return false;
    return ['text','number','url','search','tel','email',''].includes((a.type||'').toLowerCase());
  }

  function render(){
    if (typing()){ deferred = true; renderChrome(); return; }
    deferred = false;
    renderChrome();
    if (screen === 'notes')    return renderNotes();
    if (screen === 'lists')    return renderLists();
    if (screen === 'archive')  return renderArchive();
    if (screen === 'places')   return renderPlaces();
    if (screen === 'settings') return renderSettings();
    if (section === 'today')   return renderToday();
    if (section === 'tasks')   return renderTasks();
    if (section === 'library') return renderLibrary();
  }

  let toastT = null;
  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
  }

  /* ---- תור התראות ---- */
  const alertQ = [];

  function showAlert(item, why, kind){
    alertQ.push({ item, why, kind });
    if (!alertItem && !alertT) alertT = setTimeout(() => { alertT = null; nextAlert(); }, 0);
  }
  function nextAlert(){
    const a = alertQ.shift();
    if (!a){ alertItem = null; $('#alert').classList.remove('on'); return; }
    alertItem = { item:a.item, kind:a.kind };
    $('#alMsg').textContent = a.item.title;
    $('#alSub').textContent = a.why + (alertQ.length ? '  ·  ועוד ' + alertQ.length : '');

                            : a.kind === 'place' ? 'מיקום' : 'תזכורת';
    $('#alert').classList.add('on');
  }
  function closeAlert(){ alertItem = null; nextAlert(); }

  function download(name, text, mime){
    if (Native.on && Native.save(name, text, mime)) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain;charset=utf-8' }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

    get selDate(){ return selDate; }, set selDate(v){ selDate=v; },
    get calY(){ return calY; },       set calY(v){ calY=v; },
    get calM(){ return calM; },       set calM(v){ calM=v; },
    get openList(){ return openList; }, set openList(v){ openList=v; },
    get listKind(){ return listKind; }, set listKind(v){ listKind=v; },
    get itemMore(){ return itemMore; }, set itemMore(v){ itemMore=v; },
    get openNote(){ return openNote; }, set openNote(v){ openNote=v; },
    get noteQ(){ return noteQ; },     set noteQ(v){ noteQ=v; },
