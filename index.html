<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>משימה</title>
<style>
  /* ======================================================================
     משימה 2.0 — מערכת עיצוב
     מחברת שקטה: טיפוגרפיה נושאת את ההיררכיה, קווים מפרידים במקום כרטיסים,
     צבע רק כשיש לו משמעות, כמעט בלי אייקונים.
     ====================================================================== */
  :root{
    --bg:#14171c;          /* אפור-כהה רך, לא שחור */
    --surface:#191d24;
    --surface2:#1f242c;
    --surface3:#262c36;
    --line:#252b34;        /* מפריד שקט */
    --line2:#2f3742;
    --text:#e7ebf0;
    --muted:#9aa5b2;
    --muted2:#6d7783;
    --accent:#7aa2f7;
    --danger:#e0787a;

    /* קטגוריות משימה — גוונים טונליים של אותה סביבה, לא צבעים זוהרים */
    --army-bg:#172130;   --army-line:#24344a;  --army-ink:#8ab4f8;
    --home-bg:#241f18;   --home-line:#3a3122;  --home-ink:#e0b57a;
    --free-bg:#18231f;   --free-line:#25382f;  --free-ink:#8bcaa8;

    --r:10px; --r2:8px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer}
  a{color:var(--accent)}
  input[type=text],input[type=url],input[type=number],input[type=time],
  input[type=date],input[type=search],select,textarea{
    width:100%; background:var(--surface2); border:1px solid var(--line);
    border-radius:var(--r2); padding:11px 12px; outline:none; transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  ::placeholder{color:var(--muted2)}
  label{display:block;font-size:12px;color:var(--muted2);margin-bottom:6px}

  /* ---------------- מעטפת ---------------- */
  #app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
  header{
    flex:0 0 auto; padding:calc(12px + var(--safe-t)) 18px 10px;
    display:flex; align-items:center; gap:12px;
  }
  header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}
  header .sp{flex:1}
  .hbtn{
    width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    color:var(--muted);font-size:17px;transition:.15s;
  }
  .hbtn:active{background:var(--surface2);color:var(--text)}
  .gps{font-size:11px;color:var(--muted2);display:flex;align-items:center;gap:5px}
  .gps .dot{width:6px;height:6px;border-radius:50%;background:var(--muted2)}
  .gps.on .dot{background:#6ec18a}
  .gps.on{color:var(--muted)}

  main{flex:1;overflow-y:auto;padding:2px 18px 92px;-webkit-overflow-scrolling:touch}
  .sec{display:none;animation:in .18s ease}
  .sec.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  nav{
    flex:0 0 auto;display:flex;border-top:1px solid var(--line);
    background:var(--bg);padding-bottom:var(--safe-b);
  }
  nav button{
    flex:1;padding:11px 2px 12px;font-size:12.5px;font-weight:600;
    color:var(--muted2);transition:color .15s;
  }
  nav button[aria-selected="true"]{color:var(--text)}
  nav button[aria-selected="true"]::before{
    content:'';display:block;width:20px;height:2px;border-radius:2px;
    background:var(--accent);margin:0 auto 6px;
  }
  nav button::before{content:'';display:block;height:2px;margin:0 auto 6px}

  /* ---------------- טיפוגרפיה ופריסה ---------------- */
  h2.sh{
    font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--muted2);
    margin:26px 0 10px;
  }
  h2.sh:first-child{margin-top:14px}
  .big{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:6px 0 2px}
  .sub{font-size:13px;color:var(--muted2);margin-bottom:16px}
  .rule{height:1px;background:var(--line);margin:16px 0}
  .rule.short{width:56px;margin:18px 0}
  .muted{color:var(--muted)}
  .dim{color:var(--muted2)}
  .small{font-size:12.5px}

  /* ---------------- שורות ורשימות ---------------- */
  .row{
    display:flex;gap:12px;align-items:flex-start;
    padding:13px 0;border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:0}
  .row .bd{flex:1;min-width:0}
  .row .t{font-size:15px;font-weight:550;line-height:1.4}
  .row .m{font-size:12.5px;color:var(--muted2);margin-top:3px}
  .when{
    flex:0 0 46px;font-size:13px;font-variant-numeric:tabular-nums;
    color:var(--muted);direction:ltr;unicode-bidi:isolate;text-align:start;padding-top:1px;
  }
  .when .e{display:block;font-size:11px;color:var(--muted2);margin-top:2px}
  .chev{color:var(--muted2);font-size:14px;flex:0 0 auto;padding-top:2px}

  /* תיבת סימון */
  .cb{
    flex:0 0 auto;width:21px;height:21px;border-radius:6px;margin-top:1px;
    border:1.6px solid var(--line2);display:grid;place-items:center;
    font-size:12px;color:transparent;transition:.15s;
  }
  .cb:active{border-color:var(--accent);color:var(--accent)}
  .cb.on{background:var(--accent);border-color:var(--accent);color:#0d1117}
  .cb.hab{border-style:dashed}

  /* ---------------- משימות ---------------- */
  .tcard{
    border:1px solid var(--line);border-radius:var(--r);
    padding:12px 14px;margin-bottom:8px;background:var(--surface);
  }
  .tcard.army{background:var(--army-bg);border-color:var(--army-line)}
  .tcard.home{background:var(--home-bg);border-color:var(--home-line)}
  .tcard.free{background:var(--free-bg);border-color:var(--free-line)}
  .tcard.gap{margin-top:20px}   /* רווח טבעי בין קבוצות צבע — בלי קו ובלי כותרת */
  /* ארוך-טווח: פס דק בקצה, כדי שיהיה ברור מיד שזה מיכל ולא פעולה */
  .tcard.long{border-inline-start-width:3px}
  .tcard.army.long{border-inline-start-color:var(--army-ink)}
  .tcard.home.long{border-inline-start-color:var(--home-ink)}
  .tcard.free.long{border-inline-start-color:var(--free-ink)}
  .tcard.long .ttl{font-weight:700}
  .tcard .catname{font-size:11px;font-weight:600;letter-spacing:.3px}
  .tcard.army .catname{color:var(--army-ink)}
  .tcard.home .catname{color:var(--home-ink)}
  .tcard.free .catname{color:var(--free-ink)}
  .thead{display:flex;gap:11px;align-items:flex-start}
  .thead .bd{flex:1;min-width:0}
  .ttl{font-size:15.5px;font-weight:600;line-height:1.4}
  .tmeta{font-size:12.5px;color:var(--muted2);margin-top:4px}
  .tnote{
    font-size:13px;color:var(--muted);margin-top:7px;line-height:1.55;
    white-space:pre-wrap;
  }
  .kids{
    margin:10px 0 0;padding-inline-start:12px;
    border-inline-start:1px solid var(--line2);
  }
  .krow{
    display:flex;gap:10px;align-items:flex-start;padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .krow:last-child{border-bottom:0}
  .krow .kt{flex:1;font-size:14px;line-height:1.4;text-align:start}
  .krow .km{font-size:11.5px;color:var(--muted2);margin-top:2px}
  .kids .krow{
    display:flex;gap:10px;align-items:flex-start;padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .kids .krow:last-child{border-bottom:0;padding-bottom:2px}
  /* מקטע חדש מביא איתו קו — אין צורך בשניים */
  .kids .krow:has(+ .seclbl){border-bottom:0}
  .kids .krow .kt{flex:1;font-size:14px;line-height:1.4}
  .kids .krow .km{font-size:11.5px;color:var(--muted2);margin-top:2px}
  /* התיאור של תת-משימה נראה בדיוק כמו התיאור של משימה רגילה:
     טקסט על הרקע עצמו, בלי קופסה אפורה שקופצת החוצה מההיררכיה. */
  .kpeek{margin-top:5px}
  .kpeek .tnote{margin-top:2px}
  .kpeek .tnote.dim{color:var(--muted2)}
  .kpeek .acts{display:flex;gap:14px;margin-top:7px}
  .kpeek .acts button{font-size:12px;color:var(--accent);font-weight:600}
  .addkid{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:9px;padding:6px 0}
  .twist{
    font-size:12.5px;color:var(--muted2);margin-top:9px;
    display:flex;align-items:center;gap:6px;
  }
  .twist .ar{font-size:10px;transition:transform .18s}
  .twist[aria-expanded="true"] .ar{transform:rotate(90deg)}

  /* מסננים — לשוניות טקסט שקטות, לא קפסולות */
  .tabrow{display:flex;align-items:center;gap:10px;margin:2px 0 18px}
  .tabs{display:flex;gap:26px;flex:1;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{
    flex:0 0 auto;padding:9px 2px 9px;font-size:14.5px;color:var(--muted2);
    border-bottom:1.5px solid transparent;transition:.15s;
  }
  .tabs button[aria-selected="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
  .hbtn.sm{width:30px;height:30px;font-size:16px}
  .searchbar{display:flex;align-items:center;gap:6px;margin:-4px 0 16px}
  .searchbar input{flex:1;background:transparent;border:0;border-bottom:1px solid var(--line2);
    border-radius:0;padding:8px 2px}
  .searchbar input:focus{border-bottom-color:var(--accent)}

  /* מצבי תצוגה ב"היום" */
  .modes{display:flex;gap:2px;margin:2px 0 14px}
  .modes button{
    flex:1;padding:8px 4px;font-size:13px;color:var(--muted2);
    border-bottom:1.5px solid transparent;transition:.15s;
  }
  .modes button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}

  /* ---------------- אירועים ---------------- */
  .evrow{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
  .evrow .bar{flex:0 0 auto;width:2px;align-self:stretch;border-radius:2px;margin-top:2px}
  .etag{font-size:11.5px;font-weight:600}
  .edot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}

  /* ---------------- "עכשיו" ו"עבר הזמן" ---------------- */
  .nowbox{margin:2px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .nowbox .lb{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--accent);margin-bottom:8px}
  .nowline{display:flex;align-items:center;gap:9px;margin:4px 0 2px}
  .nowline .lbl{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums;direction:ltr}
  .nowline .ln{flex:1;height:1px;background:var(--accent);opacity:.45}

  /* ---------------- מצבים ריקים ---------------- */
  .empty{padding:46px 10px;text-align:center}
  .empty .h{font-size:16px;font-weight:600;margin-bottom:6px}
  .empty .d{font-size:13.5px;color:var(--muted2);line-height:1.6;margin-bottom:18px}

  /* ---------------- כפתורים ---------------- */
  .btn{
    padding:11px 16px;border-radius:var(--r2);font-size:14px;font-weight:600;
    border:1px solid var(--line);color:var(--text);transition:.15s;
  }
  .btn.p{background:var(--accent);border-color:var(--accent);color:#0d1117}
  .btn.d{color:var(--danger);border-color:transparent}
  .btn:active{opacity:.75}
  .wide{width:100%;display:block;text-align:center;margin-top:12px}
  .link{color:var(--accent);font-size:13.5px;font-weight:600}
  .txtbtn{font-size:13px;color:var(--muted);padding:8px 0}

  /* כפתור הוספה צף */
  .fab{
    position:absolute;inset-inline-end:16px;bottom:calc(14px + var(--safe-b));
    width:46px;height:46px;border-radius:50%;
    background:var(--surface2);border:1px solid var(--line2);color:var(--accent);
    font-size:24px;font-weight:300;display:grid;place-items:center;z-index:20;
    transition:.15s;
  }
  .fab:active{background:var(--surface3)}
  .fabwrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}

  /* כיוון טקסט לפי התוכן עצמו. בלי זה סוגריים וסימני פיסוק
     מתהפכים כשכותבים עברית ואנגלית/מספרים באותו שדה. */
  input[type=text],input[type=search],input[type=url],input:not([type]),textarea,
  [contenteditable]{unicode-bidi:plaintext;text-align:start}
  .tnote,.kpeek,.msum,.dsc,.m,.km,.note,.t,.ttl{unicode-bidi:plaintext}

  /* ---------------- בוחר תאריך פנימי ---------------- */
  #dpick{position:fixed;inset:0;background:rgba(8,10,14,.72);display:none;z-index:80;
    align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
  #dpick.on{display:flex}
  #dpick .mbox{max-height:86vh}
  #dpick .dgrid{direction:ltr}
  .dpday{
    aspect-ratio:1;border-radius:10px;display:grid;place-items:center;
    font-size:14px;color:var(--text);background:var(--surface2, rgba(255,255,255,.03));
  }
  .dpday.out{opacity:.32}
  .dpday.today{outline:1px solid var(--accent)}
  .dpday[aria-selected="true"]{background:var(--accent);color:#0d1117;font-weight:700}
  .dpday .dot{width:4px;height:4px;border-radius:50%;background:var(--muted2);margin-top:2px}

  /* ---------------- מודאל ---------------- */
  #modal{position:fixed;inset:0;background:rgba(8,10,14,.7);display:none;z-index:60;
    align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
  #modal.on{display:flex}
  .mbox{
    width:100%;max-width:640px;max-height:90vh;background:var(--surface);
    border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;
    display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
  .mhead{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
  .mtitle{flex:1;font-size:16px;font-weight:650}
  .mhead .x{width:30px;height:30px;border-radius:8px;color:var(--muted2);font-size:20px}
  .mbody{padding:2px 18px 6px;overflow-y:auto;flex:1}
  .mfoot{display:flex;gap:9px;padding:12px 18px calc(16px + var(--safe-b))}
  .mfoot .btn{flex:1}

  /* בוחר בתוך מודאל */
  .pick{
    display:flex;gap:12px;align-items:center;width:100%;text-align:start;
    padding:13px 2px;border-bottom:1px solid var(--line);
  }
  .pick:last-child{border-bottom:0}
  .pick .pn{flex:1;font-size:14.5px}
  .pick .pm{font-size:12px;color:var(--muted2)}
  .pick .bx{
    width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line2);
    flex:0 0 auto;display:grid;place-items:center;font-size:11px;color:transparent;
  }
  .pick[aria-checked="true"] .bx{background:var(--accent);border-color:var(--accent);color:#0d1117}
  .pick .dsc{font-size:12.5px;color:var(--muted2);margin-top:3px;line-height:1.5}

  /* ---------------- אקורדיון בעורך המשימה ---------------- */
  .acc{border-bottom:1px solid var(--line)}
  .acc > .ah{
    display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:14px 2px;
  }
  .acc > .ah .an{font-size:14.5px;font-weight:550}
  .acc > .ah .as{flex:1;font-size:12.5px;color:var(--muted2);text-align:end}
  .acc > .ah .ar{font-size:10px;color:var(--muted2);transition:transform .18s}
  .acc[aria-expanded="true"] > .ah .ar{transform:rotate(90deg)}
  .acc .ab{display:none;padding:2px 2px 16px}
  .acc[aria-expanded="true"] .ab{display:block}
  /* מקטע מרכזי בעורך — לא נספח. משמש לקישור ליומן. */
  /* תת-משימות בתוך הכרטיס — המשך של הכרטיס, לא רשימה שנייה */
  .tsubs{margin:2px 0 0;padding-inline-start:30px}
  .tsub{display:flex;align-items:center;gap:8px;padding:5px 0}
  .tsub .st2{display:flex;align-items:baseline;gap:8px;flex:1;text-align:start;min-width:0}
  .tsub .sn{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tsub .sm{font-size:11.5px;color:var(--muted2);flex:0 0 auto}
  .tsub .cb.on + .st2 .sn{opacity:.5;text-decoration:line-through}
  .tsubmore{font-size:12px;color:var(--muted2);padding:4px 0}
  .esec.big{border:1px solid var(--line2);border-radius:12px;padding:12px;margin:16px 0}
  .esec.big > .esechead > span{font-size:15px;font-weight:600}
  /* פעולות התוכן של מיכל — הן הלב שלו, ולכן הן גדולות */
  .esec.addrow.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .esec.addrow.hero .secact{
    padding:14px 10px;border:1px solid var(--line2);border-radius:12px;
    font-size:14.5px;font-weight:550;text-align:center;
  }
  /* מקטע הגדרות: כותרת גדולה יותר, כי זו הניווט הראשי של המסך */
  .setacc > .ah .an{font-size:16px;font-weight:600}
  .setacc > .ah{padding:16px 2px}
  .fgrid{display:flex;gap:10px}
  .fgrid > *{flex:1}

  /* בורר קטגוריה / סוג */
  .seg{display:flex;gap:6px}
  .seg{gap:4px}
  .seg button{
    flex:1;padding:10px 6px;border-radius:var(--r2);font-size:13.5px;
    border:1px solid var(--line);color:var(--muted);transition:.15s;
  }
  .seg button[aria-selected="true"]{background:var(--surface3);color:var(--text);border-color:var(--line2)}
  .seg.cat button[data-k="army"][aria-selected="true"]{background:var(--army-bg);border-color:var(--army-line);color:var(--army-ink)}
  .seg.cat button[data-k="home"][aria-selected="true"]{background:var(--home-bg);border-color:var(--home-line);color:var(--home-ink)}
  .seg.cat button[data-k="free"][aria-selected="true"]{background:var(--free-bg);border-color:var(--free-line);color:var(--free-ink)}

  .days{display:flex;gap:5px;direction:ltr}
  .days button{
    flex:1;padding:9px 0;border-radius:8px;font-size:12.5px;
    border:1px solid var(--line);color:var(--muted);
  }
  .days button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#0d1117}
  .times{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .times input{width:auto;flex:0 0 auto}

  /* לוח צבעים לסוגי אירוע */
  .swatches{display:flex;flex-wrap:wrap;gap:9px;padding:4px 0}
  .swatches button{width:32px;height:32px;border-radius:9px;border:2px solid transparent}
  .swatches button[aria-selected="true"]{border-color:var(--text)}

  /* ---------------- לוח חודשי ---------------- */
  /* היומן רץ משמאל לימין — ראשון בקצה השמאלי, כמו כל יומן שהוא מכיר */
  .dkids{margin-top:7px;padding-inline-start:2px;border-inline-start:1px solid var(--line);
    padding-inline-start:11px}
  .dkid{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px}
  .dkid .dkt{flex:1;line-height:1.4}
  .dkid .dkm{font-size:11.5px;color:var(--muted2)}
  .dkid.clitem .dkt{color:var(--muted)}
  .dkid .dot{width:4px;height:4px;border-radius:50%;background:var(--muted2);flex:0 0 auto}
  /* ---- העורך: בחירת סוג עם הסבר ודוגמה, לא רק תווית ---- */
  .kindpick{display:flex;flex-direction:column;gap:8px}
  .kindpick button{
    text-align:start;padding:12px 13px;border-radius:12px;
    border:1px solid var(--line);background:transparent;
  }
  .kindpick button[aria-selected="true"]{border-color:var(--accent);background:var(--surface2)}
  .kindpick .kn{display:block;font-size:14.5px;font-weight:650;margin-bottom:3px}
  .kindpick .kd{display:block;font-size:12.5px;color:var(--muted2);line-height:1.5}
  .ex{font-size:12px;color:var(--muted2);line-height:1.55;margin-top:7px}
  /* תאריך ושעה הם יחידה אחת: השורות צמודות, בלי מקטע חדש ביניהן */
  .whenrow{margin-bottom:8px}
  .whenrow .seg{margin-top:4px}
  .whenpick{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:1px}
  .hourrow{display:flex;align-items:center;gap:12px;margin-top:2px}
  .hourrow label{flex:1;margin:0}
  .hourrow input{flex:0 0 128px}
  .tbits{font-size:11.5px;color:var(--muted2);margin-top:5px}
  .dmeta{font-size:12.5px;color:var(--muted2);margin-bottom:10px}
  .dfacts{margin:10px 0}
  .dfact{display:flex;gap:10px;font-size:13px;padding:4px 0}
  .dfact .k{color:var(--muted2);flex:0 0 68px}
  .dfact .v{flex:1}
  .clbox .subrow input.newit{
    background:transparent;border:0;border-bottom:1px solid var(--line2);
    padding:6px 2px;font-size:14px;color:var(--text);
  }
  .belongs{font-size:12.5px;color:var(--muted2);margin:-6px 0 14px}
  .esec{padding:14px 0;border-top:1px solid var(--line)}
  .esec:first-child{border-top:0;padding-top:4px}
  .esechead{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  .esechead > span:first-child{
    flex:1;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted2);
  }
  .esec.addrow{display:flex;gap:16px;flex-wrap:wrap}
  .evcur{padding:8px 0}
  .evcur .el{font-size:14px}
  .evcur .em{font-size:12px;color:var(--muted2);margin-top:2px}

  /* כותרת מקטע נושאת את הפעולות ששייכות לו — במקום תפריט ⋯ ארוך */
  .sechead{display:flex;align-items:baseline;gap:12px;margin:14px 0 4px}
  .sechead:first-child{margin-top:6px}
  .secname{flex:1;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted2)}
  .secact{font-size:12px;color:var(--accent);font-weight:600;padding:3px 0}
  .secempty{padding:4px 0 6px;font-size:12.5px;color:var(--muted2);line-height:1.55}
  .secempty .ex{color:var(--muted2);opacity:.72;margin-top:2px}
  .ordering{opacity:.92}
  .ord{display:flex;gap:2px;flex:0 0 auto}
  .ord button{
    width:28px;height:28px;border-radius:8px;font-size:13px;color:var(--text);
    border:1px solid var(--line2);
  }
  .ord button[disabled]{opacity:.28}
  /* האירוע שהמשימה קשורה אליו */
  .evlink{display:flex;align-items:center;gap:9px;width:100%;text-align:start;
    padding:8px 0;margin-top:2px;font-size:13px}
  .evlink .el{flex:1}
  .evlink .em{font-size:12px;color:var(--muted2)}
  .tnotewrap{margin-top:6px}
  .tnimg{display:block;margin-top:8px;max-width:100%;max-height:230px;
    border-radius:10px;border:1px solid var(--line)}
  .imgrow{display:flex;gap:12px;align-items:center}
  .imgrow img{width:64px;height:64px;object-fit:cover;border-radius:10px;
    border:1px solid var(--line)}
  #imgzoom{position:fixed;inset:0;background:rgba(6,8,12,.92);display:none;
    z-index:90;place-items:center;padding:18px}
  #imgzoom.on{display:grid}
  #imgzoom img{max-width:100%;max-height:88vh;border-radius:12px}
  .notetog{font-size:11.5px;color:var(--muted2);text-align:start;padding:2px 0}
  .cal{direction:ltr}
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .wd{text-align:center;font-size:11px;color:var(--muted2);padding-bottom:6px}
  .day{
    aspect-ratio:1/.82;border-radius:9px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;font-size:13.5px;
    color:var(--text);font-variant-numeric:tabular-nums;
  }
  .day.out{color:var(--muted2);opacity:.45}
  .day.today{box-shadow:inset 0 0 0 1px var(--line2)}
  .day[aria-selected="true"]{background:var(--surface3)}
  .day .pips{display:flex;gap:3px;height:4px}
  .day .pip{width:4px;height:4px;border-radius:50%}

  /* אירוע רב-יומי: פס אחד רציף לאורך כל הימים שהוא תופס */
  .mweek{margin-bottom:11px}
  .mbars{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:3px}
  .mbar{
    grid-row:auto;min-width:0;min-height:17px;border-radius:5px;padding:1px 6px;
    font-size:10.5px;line-height:15px;color:#0d1117;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:start;
  }
  .mbar.mid{border-radius:0}
  .mbar.head{border-start-end-radius:0;border-end-end-radius:0}
  .mbar.tail{border-start-start-radius:0;border-end-start-radius:0}
  .mbar.gap2{visibility:hidden}
  /* ניווט היומן — חצים בכיוון שהעין מצפה לו במצב LTR */
  .calnav{display:flex;align-items:center;gap:8px;padding:0 0 12px;direction:ltr}
  .calnav .ttl{flex:1;text-align:center;font-size:15px;font-weight:600}
  /* ניווט הטווח רץ LTR כמו שאר היומן; רק הכותרת נשארת עברית */
  .rangenav{display:flex;align-items:center;gap:8px;margin-bottom:14px;direction:ltr}
  .rangenav .ttl{flex:1;font-size:12.5px;color:var(--muted2);direction:rtl;text-align:center}

  /* ---------------- התראה ---------------- */
  #alert{position:fixed;inset:0;background:rgba(8,10,14,.78);display:none;z-index:80;
    place-items:center;padding:24px;backdrop-filter:blur(4px)}
  #alert.on{display:grid}
  #alert .box{
    background:var(--surface);border:1px solid var(--line2);border-radius:18px;
    padding:26px 22px 20px;width:100%;max-width:360px;text-align:center;
  }
  #alert .k{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted2);margin-bottom:8px}
  #alert .msg{font-size:19px;font-weight:650;line-height:1.35;margin-bottom:6px}
  #alert .sub2{font-size:13.5px;color:var(--muted);margin-bottom:14px}
  #alert .det{
    max-height:38vh;overflow-y:auto;margin-bottom:20px;padding-top:12px;
    border-top:1px solid var(--line);text-align:start;
  }
  #alert .det .dnote{font-size:13.5px;color:var(--muted);line-height:1.6;
    white-space:pre-wrap;unicode-bidi:plaintext}
  #alert .det img{display:block;margin-top:10px;max-width:100%;max-height:150px;border-radius:9px}
  #alert .det .dk{display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0}
  #alert .det .dk .dot{width:4px;height:4px;border-radius:50%;background:var(--muted2);flex:0 0 auto}
  #alert .det .dh{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted2);
    margin:10px 0 3px}
  #alert .btns{display:flex;gap:9px}
  #alert .btns .btn{flex:1}

  /* ---------------- טוסט ---------------- */
  #toast{
    position:fixed;left:50%;transform:translateX(-50%) translateY(10px);
    bottom:calc(74px + var(--safe-b));background:var(--surface3);
    border:1px solid var(--line2);padding:10px 16px;border-radius:11px;
    font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:70;max-width:88vw;
  }
  #toast.on{opacity:1;transform:translateX(-50%)}
  #toast.act{pointer-events:auto}
  #toast .un{margin-inline-start:16px;color:var(--accent);font-weight:600}

  /* ---- תת-משימות בתוך העורך: שורות פשוטות, לא כרטיסים ---- */
  .subrow{display:flex;gap:10px;align-items:center;padding:11px 2px;
          border-bottom:1px solid var(--line)}
  .subrow .sb2{flex:1;min-width:0;text-align:start}
  .subrow .st2{font-size:14.5px}
  .subrow .sm2{font-size:11.5px;color:var(--muted2);margin-top:2px}
  .subempty{font-size:13px;color:var(--muted2);padding:10px 2px}

  /* ---- שלושת המקטעים: הבדל דרך טיפוגרפיה וקו דק, לא כרטיסים ולא צבע ---- */
  .seclbl{
    font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--muted2);
    margin:13px 0 5px;padding-top:10px;border-top:1px solid var(--line);
  }
  .seclbl:first-child{margin-top:0;padding-top:0;border-top:0}
  /* ---- פריט ברשימה: ישות קלה — שם, סימון, ואולי הערה ---- */
  .clrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
  .clrow .ct{flex:1;min-width:0;font-size:14px;line-height:1.4;text-align:start}
  .clrow.ck .ct{color:var(--muted2);text-decoration:line-through}
  .clrow .cn{font-size:11.5px;color:var(--muted2);margin-top:2px;
             text-decoration:none;display:block}
  .ord{display:flex;gap:4px;flex:0 0 auto}
  .ord button{width:27px;height:27px;border:1px solid var(--line2);border-radius:7px;
              color:var(--muted2);font-size:12px}
  .ord button[disabled]{opacity:.28}
  .alrow{display:flex;gap:10px;align-items:center;padding:12px 2px;
         border-bottom:1px solid var(--line)}
  .alrow .at2{flex:1;font-size:14.5px}
  .alrow .atime{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;
                direction:ltr;unicode-bidi:isolate}
  .alrow .done2{font-size:12px;color:var(--muted2)}

  /* ---- פס רצף (רק בפרטי המשימה) ---- */
  .strip{display:flex;gap:3px;direction:ltr}
  .strip i{flex:1;height:18px;border-radius:4px;background:var(--surface3);font-style:normal;
           display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted2)}
  .strip i.off{opacity:.3}
  .strip i.full{background:#3f7d5f;color:#0d1117}
  .strip i.td{outline:1.5px solid var(--accent);outline-offset:1px}

  /* ---- מחלקות עזר בתוך מודאלים ---- */
  .note{font-size:12.5px;color:var(--muted2);line-height:1.6}
  .msum{white-space:pre-wrap;font-size:13.5px;line-height:1.7;background:var(--surface2);
        border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
  .item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .msum{border:0;background:transparent;padding:10px 12px;
        border-inline-start:2px solid var(--line2)}
  .item:last-child{border-bottom:0}
  .item .rb{flex:1;font-size:14px}

  /* ---------------- הודעות מערכת ---------------- */
  .notice{
    border-inline-start:2px solid var(--line2);padding:2px 12px;
    font-size:13px;color:var(--muted2);line-height:1.65;margin:10px 0 14px;
  }
  .notice.warn{border-inline-start-color:var(--danger);color:var(--muted)}
  .notice b{color:var(--text)}

  /* ---------------- הערות (עורך) ---------------- */
  .ncard{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
  .ncard .nb{flex:1;min-width:0}
  .ncard .nt{font-size:15px;font-weight:600;margin-bottom:3px}
  .ncard .np{font-size:12.5px;color:var(--muted2);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ncard .nd{font-size:11px;color:var(--muted2);margin-top:6px}
  .ncard .thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:0 0 auto}
  #noteEdit{display:flex;flex-direction:column}
  .ntop{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .ntop input{flex:1;font-size:17px;font-weight:650;background:transparent;border:0;padding:8px 2px}
  .ntools{padding:0 0 8px;margin-bottom:8px;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:5;background:var(--bg)}
  .trow2{display:flex;gap:3px;flex-wrap:wrap}
  .trow2+.trow2{margin-top:4px;padding-top:4px;border-top:1px solid var(--line)}
  .trow2 button{flex:0 0 auto;min-width:36px;height:34px;padding:0 10px;border-radius:var(--r2);
    color:var(--muted);font-size:13px;
    display:inline-flex;align-items:center;justify-content:center;gap:4px}
  .trow2 button:active{background:var(--surface2);color:var(--text)}
  .trow2 button[aria-pressed="true"]{background:var(--accent);color:#0d1117;border-color:var(--accent)}
  .trow2 .tsep{flex:0 0 auto;width:1px;background:var(--line);margin:4px 3px}
  .trow2 .swatch{width:11px;height:11px;border-radius:3px;border:1px solid #0006;background:#e7ebf0}
  .sheetgrid{display:flex;flex-wrap:wrap;gap:7px}
  .sbtn{padding:9px 13px;border-radius:var(--r2);border:1px solid var(--line);
        font-size:13.5px;color:var(--text);transition:.15s}
  .sbtn:active{background:var(--surface3)}
  .sbtn[aria-pressed="true"]{background:var(--surface3);border-color:var(--accent);color:var(--accent)}
  .palette{display:flex;flex-wrap:wrap;gap:6px;padding:8px 2px 2px}
  .palette button{width:27px;height:27px;border-radius:8px;border:1px solid var(--line)}
  .palette button.clear{width:auto;padding:0 10px;font-size:12px;color:var(--muted)}
  .nbody{flex:1;min-height:56vh;background:transparent;border:0;
    padding:6px 2px;overflow-y:auto;
    font-size:calc(16px * var(--nz,1));line-height:1.75;outline:none;
    -webkit-user-select:text;user-select:text}
  .nbody:focus{outline:none}
  .nbody:empty:before{content:attr(data-ph);color:var(--muted2)}
  .nbody h1{font-size:1.4em;font-weight:750;margin:.9em 0 .35em;line-height:1.3}
  .nbody h2{font-size:1.16em;font-weight:700;margin:.85em 0 .3em;line-height:1.35}
  .nbody p{margin:0 0 .65em}
  .nbody ul,.nbody ol{margin:0 0 .7em;padding-inline-start:1.4em}
  .nbody li{margin-bottom:.25em}
  .nbody blockquote{margin:.6em 0;padding:.2em 0 .2em .9em;
    border-inline-start:2px solid var(--accent);color:var(--muted);font-style:italic}
  .nbody a{color:#8ec5e8;text-decoration:underline;word-break:break-word}
  .nbody img{max-width:100%;height:auto;border-radius:9px;margin:.5em 0;display:block}
  .nbody hr{border:0;border-top:1px solid var(--line);margin:1.1em 0}
  .nfoot{font-size:11px;color:var(--muted2);text-align:center;padding:8px 0 2px}

  /* ---------------- קניות ---------------- */
  .lrow{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .lrow .lb{flex:1;min-width:0}
  .lrow .ln2{font-size:15px;font-weight:600}
  .lrow .lm{font-size:12px;color:var(--muted2);margin-top:3px}
  .irow{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
  .irow.done .it{text-decoration:line-through;color:var(--muted2)}
  .irow .ib{flex:1;min-width:0}
  .irow .it{font-size:14.5px}
  .irow .im{font-size:11.5px;color:var(--muted2);margin-top:2px}
  .irow img{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:0 0 auto}
  .x{color:var(--muted2);font-size:18px;padding:0 4px;flex:0 0 auto}

  /* ---------------- מקומות ---------------- */
  .prow{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
  .prow .pb{flex:1;min-width:0}
  .prow .pn2{font-size:14.5px;font-weight:550}
  .prow .pm2{font-size:11.5px;color:var(--muted2);margin-top:2px}
  .subplaces{padding-inline-start:14px;border-inline-start:1px solid var(--line2);margin-inline-start:2px}

  /* ---------------- הגדרות ---------------- */
  .set{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .set .sb{flex:1;min-width:0}
  .set .st{font-size:14.5px;font-weight:550}
  .set .sd{font-size:12px;color:var(--muted2);margin-top:3px;line-height:1.5}
  .sw{width:44px;height:26px;border-radius:999px;background:var(--surface3);
    border:1px solid var(--line2);position:relative;flex:0 0 auto;transition:.18s}
  .sw::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;
    border-radius:50%;background:var(--muted);transition:.18s}
  .sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
  .sw[aria-checked="true"]::after{inset-inline-start:20px;background:#0d1117}

  /* ---------------- מסלול ---------------- */
  .stops{margin-top:6px}
  .stop{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .stop .num{width:20px;height:20px;border-radius:6px;background:var(--surface3);
    color:var(--muted);font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
  .stop .sn{flex:1;font-size:14px}
  .stop .sd2{font-size:11.5px;color:var(--muted2)}

  /* ארכיון */
  .arow{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
  .arow .ab2{flex:1;min-width:0}
  .arow .at{font-size:14.5px;color:var(--muted)}
  .arow .am{font-size:11.5px;color:var(--muted2);margin-top:3px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="hTitle">היום</h1>
    <div class="sp"></div>
    <div class="gps" id="gps"><span class="dot"></span><span id="gpsTxt">GPS</span></div>
    <button class="hbtn" id="topMenu" aria-label="תפריט">⋯</button>
  </header>

  <div class="fabwrap">
  <main>

    <!-- ======================= היום ======================= -->
    <section class="sec on" id="s-today">
      <div class="modes" id="tvModes">
        <button data-v="day" aria-selected="true">היום</button>
        <button data-v="d3">3 ימים</button>
        <button data-v="week">שבוע</button>
        <button data-v="month">חודש</button>
      </div>
      <div id="todayBody"></div>
    </section>

    <!-- ======================= משימות ======================= -->
    <section class="sec" id="s-tasks">
      <div class="tabrow">
        <div class="tabs" id="tFilters">
          <button data-f="all" aria-selected="true">הכול</button>
          <button data-f="army">צבא</button>
          <button data-f="home">בית</button>
          <button data-f="free">אישי</button>
        </div>
        <button class="hbtn sm" id="tSearchOpen" aria-label="חיפוש במשימות">⌕</button>
      </div>
      <div class="searchbar" id="tSearchBar" hidden>
        <input type="search" id="tSearch" placeholder="חיפוש במשימות"
               autocomplete="off" aria-label="חיפוש במשימות">
        <button class="hbtn sm" id="tSearchClose" aria-label="סגור חיפוש">×</button>
      </div>
      <div id="tasksBody"></div>
    </section>

    <!-- ======================= ספרייה ======================= -->
    <section class="sec" id="s-library">
      <div id="libIndex">
        <h2 class="sh">כלים</h2>
        <button class="row" data-lib="notes" style="width:100%;text-align:start">
          <div class="bd"><div class="t">הערות</div><div class="m" id="libNotes">—</div></div>
          <span class="chev">‹</span>
        </button>
        <button class="row" data-lib="lists" style="width:100%;text-align:start">
          <div class="bd"><div class="t">קניות</div><div class="m" id="libLists">—</div></div>
          <span class="chev">‹</span>
        </button>

<script>
'use strict';
/* ==========================================================================
   משימה 0.3
   Store  – נתונים. נקודת ההחלפה היחידה לסנכרון ענן בעתיד.
   Geo    – מרחקים, מעקב, וצבירת מרחק נסיעה.
   Search – חיפוש מקומות לפי שם (שני ספקים + נפילה לידני).
   Alerts – רטט/צליל/התראה.
   Cal    – עזרי יומן + ייצוא ICS.
   UI     – רינדור בלבד.
   Engine – מנוע התזכורות.
   ========================================================================== */

/* חותמת גרסה. הבודק מול השרת מחפש בדיוק את השורה הזאת. */
const BUILD = '4.0 · 2026-09-02';
/* הגרסה המינימלית של מעטפת האנדרואיד שה-HTML הזה מסתמך עליה. */
const NEED_APK = '1.1';

/* ------------------------------- Store ---------------------------------- */
const Store = (() => {
  const KEY = 'mesima.v1';
  const seed = () => ({ v:5, tasks:[], places:[], lists:[], events:[], notes:[],
                        eventTypes:[], links:[],
                        prefs:{ vib:true, snd:true, geo:false, notif:false, noteZoom:1 } });

  let persist = true;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
  catch(e){ persist = false; }

  let data;
  try {
    const raw = persist ? localStorage.getItem(KEY) : null;
    data = raw ? Object.assign(seed(), JSON.parse(raw)) : seed();
  } catch(e){ data = seed(); }
  /* מיגרציות */
  if (!Array.isArray(data.events)) data.events = [];
  if (!data.prefs) data.prefs = seed().prefs;
  if (!data.prefs.noteZoom) data.prefs.noteZoom = 1;
  if (!Array.isArray(data.lists)) data.lists = [];
  if (!Array.isArray(data.notes)) data.notes = [];
  /* v2 -> v3: רשימת הקניות השטוחה הופכת לרשימה אחת מסוג "פשוט" */
  if (Array.isArray(data.shop) && data.shop.length){
    data.lists.unshift({
      id:'migrated-shop', name:'קניות', kind:'simple', forWho:'', phone:'',
      createdAt:Date.now(),
      items:data.shop.map(x=>({ id:x.id, title:x.title, where:x.where||'', link:'', img:'',
                                done:!!x.done, price:null, note:'', releaseDate:'', notified:false }))
    });
  }
  delete data.shop;
  /* הרגל שסומן "בוצע" נעלם מכל התצוגות ואי אפשר להחזיר אותו.
     זה קרה בגלל שכפתור "בוצע" בהתראה קרא ל-toggleTask. מרפאים למפרע. */
  data.tasks.forEach(t=>{
    if (t.repeat && t.repeat.times && t.repeat.times.length && t.done){
      t.done = false; t.doneAt = null; t.autoDone = false;
    }
  });
  data.tasks.forEach(t=>{ if(t.parentId===undefined) t.parentId=null;
                          if(t.planned===undefined) t.planned=null;
                          if(t.eventId===undefined) t.eventId=null;
                          if(t.note===undefined) t.note='';
                          if(t.repeat===undefined) t.repeat=null;
                          if(!t.log) t.log={}; });
  data.places.forEach(p=>{ if(p.parentId===undefined) p.parentId=null; });
  data.events.forEach(e=>{
    if (!['army','home','personal'].includes(e.cat)) e.cat = 'personal';
    if (e.note === undefined) e.note = '';
    if (e.taskIds !== undefined) delete e.taskIds;
    if (e.endDate === undefined) e.endDate = '';
    if (e.allDay === undefined) e.allDay = false;
    if (e.listId === undefined) e.listId = null;
    if (!e.end){                       /* גרסאות ישנות שמרו אורך בדקות */
      const [h,m] = (e.time||'09:00').split(':').map(Number);
      const t = h*60 + m + (e.mins || 60);
      e.end = String(Math.floor(t/60) % 24).padStart(2,'0') + ':' + String(t % 60).padStart(2,'0');
    }
  });
  /* ---------- v3 -> v4 (גרסה 2.0) ---------- */
  if (!Array.isArray(data.eventTypes)) data.eventTypes = [];
  if (!data.eventTypes.length){
    /* סוגי אירוע נולדים מהקטגוריות הישנות, ומכאן ואילך הם עצמאיים */
    data.eventTypes = [
      { id:'t_army', name:'צבא',  color:'#7aa2f7' },
      { id:'t_home', name:'בית',  color:'#e0a458' },
      { id:'t_pers', name:'אישי', color:'#b48ead' },
    ];
  }
  const CAT2TYPE = { army:'t_army', home:'t_home', personal:'t_pers' };
  data.events.forEach(e => {
    if (!e.typeId) e.typeId = CAT2TYPE[e.cat] || 't_pers';
  });

  data.tasks.forEach(t => {
    /* מחזור חיים: קצר-טווח (נגמר) מול ארוך-טווח (מיכל שלא נגמר מעצמו) */
    if (t.kind !== 'short' && t.kind !== 'long' && t.kind !== 'list') t.kind = 'short';
    /* ארכיון: כל מה שכבר סומן כבוצע עובר לארכיון ולא נעלם */
    if (t.archived === undefined){
      t.archived  = !!t.done;
      t.archivedAt = t.done ? (t.doneAt || Date.now()) : null;
    }
    if (t.autoArch === undefined) t.autoArch = false;
    /* הרגל הוא משימה רגילה — הוא לא "נגמר" ולכן לא מגיע לארכיון */
    if (t.repeat && t.repeat.times && t.repeat.times.length){
      t.archived = false; t.archivedAt = null; t.done = false; t.doneAt = null;
    }
  });
  /* ---------- v4 -> v5: פריט ארוך-טווח לא יכול להיות הרגל בעצמו ----------
     אם נשמר לו לוח חזרות, מעבירים אותו לתת-משימה קצרת-טווח אחת ומסמנים
     שהטיפול בוצע, כדי שטעינה חוזרת לא תיצור כפילויות. */
  data.tasks.slice().forEach(t => {
    if (t.kind !== 'long' || !t.repeat || !t.repeat.times || !t.repeat.times.length) return;
    if (!t.repeatMovedTo || !data.tasks.some(x => x.id === t.repeatMovedTo)){
      const child = {
        id: (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
        mission: t.mission, title: t.title, done:false, createdAt: Date.now(), doneAt:null,
        reminder:null, rt:{}, parentId: t.id, planned:null, eventId:null, note:'',
        repeat: t.repeat, log: t.log || {}, collapsed:true, kind:'short',
        archived:false, archivedAt:null, autoArch:false,
      };
      data.tasks.push(child);
      t.repeatMovedTo = child.id;
    }
    t.repeat = null; t.log = {};
  });
  /* ---------- v4 -> v5: פריט ברשימה הוא ישות קלה, וסדר מפורש לכל ילד ----------
     פריט אינו משימה: אין לו קטגוריה, תאריך, תזכורת, ארכיון או נוכחות ב"היום".
     תת-משימות קיימות נשארות תת-משימות — אפשר להמיר אותן ידנית לפריטים. */
  data.tasks.forEach((t, i) => {
    if (!Array.isArray(t.checklist)) t.checklist = [];
    t.checklist = t.checklist.filter(c => c && c.title).map(c => ({
      id: c.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
      title: String(c.title), note: c.note || '', checked: !!c.checked }));
    if (typeof t.sortIndex !== 'number') t.sortIndex = i;
  });
  /* ---------- v5 -> v6: תמונה אחת לכל משימה, וסוג "רשימה" ----------
     `noteHidden` יצא משימוש ב-2.6 — הקיפול הוא מצב תצוגה בלבד. */
  data.tasks.forEach(t => { if (t.img === undefined) t.img = null; });
  /* ---------- v6 -> v7: "רשימה" מפסיקה להיות סוג משימה ----------
     היא הייתה שאלה של מימוש, לא שאלה של משתמש. שום נתון לא הולך לאיבוד:
     הפריטים, התת-משימות, ההרגלים, החזרה, התאריך והתמונה נשארים כפי שהם.
     רשימה שנשאה חזרה או תזכורת נשארת קצרת-טווח, כדי שהתזכורת תמשיך לעבוד
     בדיוק כמו קודם. אחרת היא הופכת למיכל ארוך-טווח, שזה מה שהיא באמת. */
  /* ---------- v7 -> v8: כמה צ׳קליסטים בעלי שם באותה משימה ----------
     הפריטים הקיימים עוברים כמו שהם לצ׳קליסט אחד — אותם מזהים, שמות,
     הערות, סימונים וסדר. השדה הישן נמחק אחרי ההעברה, ולכן טעינה חוזרת
     לא יכולה ליצור עותק שני. */
  data.tasks.forEach(t => {
    if (!Array.isArray(t.checklists)){
      const old = Array.isArray(t.checklist) ? t.checklist : [];
      t.checklists = old.length
        ? [{ id: (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
             name:'צ׳קליסט', items: old }]
        : [];
    }
    delete t.checklist;
    t.checklists = t.checklists.filter(c => c && Array.isArray(c.items)).map(c => ({
      id: c.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
      name: String(c.name || 'צ׳קליסט'),
      items: c.items.filter(x => x && x.title).map(x => ({
        id: x.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
        title: String(x.title), note: x.note || '', checked: !!x.checked })),
    }));
  });
  data.tasks.forEach(t => {
    if (t.kind !== 'list') return;
    const ticks = !!(t.repeat && t.repeat.times && t.repeat.times.length);
    const timed = !!(t.reminder && t.reminder.type);
    t.kind = (ticks || timed) ? 'short' : 'long';
  });
  /* ---------- v8 -> v9: חריגים, התאמה סביב אירועים, וצ׳קליסט חוזר ----------
     שלושת אלה נשמרים על האובייקטים הקיימים ולא במודל שני. פריט חוזר הוא
     עדיין משימה עם repeat, בדיוק כמו קודם. */
  data.tasks.forEach(t => {
    if (t.repeat && Array.isArray(t.repeat.times)){
      if (!Array.isArray(t.repeat.skipTypes)) t.repeat.skipTypes = [];
      if (t.repeat.skipScope !== 'week') t.repeat.skipScope = 'day';
      if (typeof t.repeat.around !== 'boolean') t.repeat.around = false;
    }
    /* פריט חוזר הוא פעולה אטומית: אין בו תת-משימות, צ׳קליסטים או הרגלים.
       תוכן שנשמר בעבר לא נמחק — הוא משתחרר החוצה כדי שלא ייעלם. */
    (t.checklists || []).forEach(c => {
      if (!c.repeat) { c.repeat = null; return; }
      if (!Array.isArray(c.repeat.days)) c.repeat.days = [];
      if (!c.repeat.time) c.repeat.time = '20:00';
      if (typeof c.repeat.resetMin !== 'number') c.repeat.resetMin = 360;
      if (!Array.isArray(c.repeat.skipTypes)) c.repeat.skipTypes = [];
      if (c.repeat.skipScope !== 'week') c.repeat.skipScope = 'day';
    });
  });
  /* משימה חוזרת שהחזיקה תוכן — התוכן עובר החוצה ולא נמחק */
  data.tasks.forEach(t => {
    const rep = t.repeat && t.repeat.times && t.repeat.times.length;
    if (!rep || t.kind === 'long') return;
    const kids = data.tasks.filter(x => x.parentId === t.id);
    kids.forEach(k => { k.parentId = t.parentId || null; });
    if ((t.checklists || []).length && t.parentId){
      const host = data.tasks.find(x => x.id === t.parentId);
      if (host){ host.checklists = (host.checklists||[]).concat(t.checklists); t.checklists = []; }
    }
  });
  /* ---------- v8 -> v9: "חד-פעמית" חייבת להיות פעם אחת ----------
     תזכורת שעה בלי תאריך נרשמה עד כה בכל יום מחדש. מצמידים לה את
     המופע הקרוב — היום אם השעה עוד לפנינו, אחרת מחר. */
  (() => {
    const p2 = x => String(x).padStart(2,'0');
    const k = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
    const today = k(new Date());
    const tomorrow = (() => { const d = new Date(); d.setDate(d.getDate()+1); return k(d); })();
    const nowHM = new Date().toTimeString().slice(0,5);
    data.tasks.forEach(t => {
      if (t.kind === 'long') return;
      if (t.repeat && t.repeat.times && t.repeat.times.length) return;
      if (!t.reminder || t.reminder.type !== 'time') return;
      if (t.planned) return;
      t.planned = (t.reminder.at > nowHM) ? today : tomorrow;
    });
  })();
  data.v = 9;

  /* ---------- v9 -> v10: מיכל, פריט חוזר, ומחזור צ׳קליסט ----------
     שום תוכן לא נמחק כאן. מה שמיכל כבר לא רשאי להחזיק עובר ל-t.parked
     ונשאר בנתונים; מה שחסר בשדות חדשים מקבל ברירת מחדל בטוחה. */
  if (!Array.isArray(data.links)) data.links = [];
  data.links = data.links.filter(l => l && l.url).map(l => ({
    id: l.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
    name: String(l.name || l.url), url: String(l.url),
  }));

  data.tasks.forEach(t => {
    if (t.parked === undefined) t.parked = null;
    (t.checklists || []).forEach(c => {
      if (c.repeat){
        /* נקודת האיפוס אינה נשאלת יותר — היא קבועה על שש שעות */
        c.repeat.resetMin = 360;
        if (typeof c.repeat.around !== 'boolean') c.repeat.around = false;
        if (!Array.isArray(c.repeat.skipTypes)) c.repeat.skipTypes = [];
        if (c.repeat.skipScope !== 'week') c.repeat.skipScope = 'day';
        if (!c.rt || typeof c.rt !== 'object') c.rt = { cycle:'', doneAt:null };
        if (c.rt.doneAt === undefined) c.rt.doneAt = null;
      } else {
        /* צ׳קליסט רגיל נשאר רגיל — חזרתיות נדלקת רק במפורש */
        c.repeat = null;
      }
    });
  });

  /* מיכל אינו נושא תאריך, שעה, תזכורת או קישור לאירוע. הערכים לא
     נמחקים — הם נשמרים ב-parked כדי שאפשר יהיה לראות ולשחזר. */
  data.tasks.forEach(t => {
    if (t.kind !== 'long') return;
    const had = t.planned || t.reminder || t.repeat || t.eventId;
    if (had && !t.parked){
      t.parked = { planned:t.planned || null, reminder:t.reminder || null,
                   repeat:t.repeat || null, eventId:t.eventId || null, at:Date.now() };
    }
    t.planned = null; t.reminder = null; t.repeat = null; t.eventId = null; t.log = {};
  });

  /* מיכל בתוך מיכל אסור בכל עומק. הילד נשאר במקומו ורק הופך לקצר-טווח. */
  (() => {
    const byId = new Map(data.tasks.map(t => [t.id, t]));
    const underLong = t => {
      let p = t.parentId ? byId.get(t.parentId) : null, g = 0;
      while (p && g++ < 16){
        if (p.kind === 'long') return true;
        p = p.parentId ? byId.get(p.parentId) : null;
      }
      return false;
    };
    data.tasks.forEach(t => { if (t.kind === 'long' && underLong(t)) t.kind = 'short'; });
  })();

  data.v = 10;

  const subs = [];
  const save = () => {
    if (persist) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ persist = false; } }
    subs.forEach(f => f());
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  return {
    get canPersist(){ return persist; },
    get all(){ return data; },
    onChange(f){ subs.push(f); },
    commit: save,

    tasks(m){ return data.tasks.filter(t => t.mission === m && !t.archived); },
    /** כל המשימות הפעילות, אופציונלית מסוננות לפי קטגוריה. 'all' = הכול */
    active(cat){ return data.tasks.filter(t => !t.archived && (!cat || cat==='all' || t.mission===cat)); },
    task(id){ return data.tasks.find(t => t.id === id); },
    /** ילדים ישירים של משימה. null = משימות שורש. */
    children(parentId, mission){
      return data.tasks.filter(t => t.parentId === parentId && !t.archived &&
                                    (mission == null || mission === 'all' || t.mission === mission));
    },
    /** ילדים כולל מאורכבים — לתצוגת עץ בארכיון */
    childrenAll(parentId){ return data.tasks.filter(t => t.parentId === parentId); },
    /** כל הצאצאים לכל עומק — לספירה ולמחיקה רקורסיבית */
    descendants(id){
      const out = [];
      const walk = pid => data.tasks.forEach(t => { if (t.parentId === pid){ out.push(t); walk(t.id); } });
      walk(id); return out;
    },
    depth(id){
      let d = 0, t = this.task(id);
      while (t && t.parentId){ d++; t = this.task(t.parentId); }
      return d;
    },
    addTask(o){
      const t = { id:uid(), mission:o.mission, title:o.title, done:false,
        createdAt:Date.now(), doneAt:null, reminder:o.reminder||null, rt:o.rt||{},
        parentId:o.parentId||null, planned:o.planned||null, eventId:o.eventId||null,
        note:o.note||'', repeat:o.repeat||null, log:{}, collapsed:true,
        kind:(o.kind === 'long') ? 'long' : 'short',
        img:o.img||null, archived:false, archivedAt:null, autoArch:false,
        checklists:[], parked:null, sortIndex:0 };
      /* מיכל בתוך מיכל אסור בכל עומק. ילד של מיכל הוא תמיד קצר-טווח,
         ולכן גם לא נשאלת עליו השאלה בשום מקום בממשק. */
      if (t.kind === 'long' && !this.canBeLong(null, t.parentId)) t.kind = 'short';
      if (t.kind === 'long'){
        t.parked = this.parkSchedule(t);
        t.reminder = null; t.repeat = null; t.planned = null; t.eventId = null;
      }
      /* תת-משימה יורשת את המשימה-על של ההורה, אחרת היא נעלמת מהתצוגה */
      if (t.parentId){
        let p = this.task(t.parentId);
        /* פריט חוזר הוא פעולה אטומית ולא מחזיק תוכן. אם מישהו מנסה לתלות
           בו משהו, הפריט נתלה על ההורה שלו ולא נעלם בשקט. */
        let guard = 0;
        while (p && !this.canHoldContent(p) && guard++ < 8){
          t.parentId = p.parentId || null;
          p = t.parentId ? this.task(t.parentId) : null;
        }
        if (p) t.mission = p.mission;
      }
      /* משימה חדשה נכנסת למקום שהעין מחפשת: שורש בראש, תת-משימה בסוף הרשימה */
      t.sortIndex = (typeof o.sortIndex === 'number') ? o.sortIndex : this.freeIndex(t);
      data.tasks.unshift(t); save(); return t;
    },
    /** מיקום פנוי בקצה הנכון של הקבוצה שאליה הפריט שייך */
    freeIndex(t){
      /* משימה ראשית נכנסת לראש הרצף הגלובלי — יש רצף אחד, לא אחד לקטגוריה */
      const sibs = t.parentId ? this.childrenAll(t.parentId)
                              : data.tasks.filter(x => !x.parentId);
      const idx = sibs.filter(x => x.id !== t.id).map(x => x.sortIndex || 0);
      if (!idx.length) return 0;
      return t.parentId ? Math.max(...idx) + 1 : Math.min(...idx) - 1;
    },
    updateTask(id, patch){
      const t=this.task(id); if(!t) return;
      const rt = patch.rt;              /* אפשר לקבוע rt מפורש — למשל "אל תירה היום" */
      const wasLong = t.kind === 'long';
      Object.assign(t, patch);
      t.rt = rt || {};
      /* אותם שני חוקים שנאכפים ביצירה נאכפים גם בעריכה, כדי שלא תיווצר
         דרך עוקפת דרך הטופס. */
      if (t.kind === 'long' && !this.canBeLong(t.id, t.parentId)) t.kind = 'short';
      if (t.kind === 'long'){
        if (!wasLong) t.parked = this.parkSchedule(t);
        t.reminder = null; t.repeat = null; t.planned = null; t.eventId = null;
        t.log = {};
      }
      save();
    },
    setPlanned(id, date){
      const t=this.task(id); if(!t) return;
      if (t.kind === 'long') return;    /* מיכל לא נושא תאריך */
      t.planned=date; save();
    },
    toggleCollapse(id){ const t=this.task(id); if(t){ t.collapsed=!t.collapsed; save(); } },
    /** משימות שתוכננו ליום מסוים */
    plannedFor(date){ return data.tasks.filter(t => t.planned === date && !t.archived && !this.isHabit(t)); },
    /** משימות שקושרו לאירוע */
    tasksForEvent(eventId){ return data.tasks.filter(t => t.eventId === eventId && !t.archived); },
    linkTask(taskId, eventId){
      const t = this.task(taskId); if(!t) return;
      if (t.kind === 'long') return;    /* מיכל לא מקושר ליומן */
      t.eventId = eventId || null;
      const ev = eventId ? this.event(eventId) : null;
      if (ev && !t.planned) t.planned = ev.date;   /* נוח: המשימה נוחתת ביום האירוע */
      save();
    },
    /* ---------- הרגל יומי ----------
       t.repeat = { days:[0..6], times:['08:00','16:00'] }
       t.log    = { '2026-08-26': 1 }  — קיום המפתח = היום סומן */
    /* פריט ארוך-טווח לעולם אינו הרגל בעצמו — ההרגל הוא תת-משימה שלו.
       הבדיקה מגנה גם על נתונים ישנים שנשמרו לפני התיקון. */
    isHabit(t){ return !!(t && t.kind !== 'long' &&
                          t.repeat && t.repeat.times && t.repeat.times.length); },
    habitDay(t, date){ return Recur.active(t.repeat, date); },
    /* ---------- חריגים לפי סוג אירוע ----------
       cfg = { skipTypes:[מזהי סוג], skipScope:'day'|'week' }
       שומרים מזהים ולא שמות, כדי ששינוי שם של סוג אירוע לא ישבור כלום.
       יום שדולג עליו אינו "יום חובה" — ולכן הוא לא שובר רצף ולא מזכיר. */
    /* חזרתיות היא מנוע אחד. Store רק מפנה אליו, כדי שלא תיווצר
       סמנטיקה שנייה להרגל מול צ׳קליסט חוזר. */
    skipDates(cfg, date){ return Recur.skipped(cfg, date); },
    /** האם ההרגל נדרש בתאריך הזה: יום פעיל, ובלי חריג */
    habitRequired(t, date){
      return this.isHabit(t) && Recur.due(t.repeat, date);
    },
    /** האם קיים חריג פעיל היום — כדי שה-UI יסביר למה ההרגל שקט */
    habitSkipped(t, date){
      return this.isHabit(t) && Recur.active(t.repeat, date) && Recur.skipped(t.repeat, date);
    },
    /** פריט חוזר הוא פעולה אטומית: בלי תת-משימות, צ׳קליסטים או הרגלים */
    canHoldContent(t){ return !!t && !this.isHabit(t); },
    /* השעות הן ניסיונות חוזרים על אותה משימה, לא שלבים:
       סימון אחד סוגר את היום ומשתיק את השעות שנותרו. */
    habitFull(t, date){ return !!(t.log && t.log[date]); },
    tickHabit(id, date){
      const t = this.task(id); if(!t || !this.isHabit(t)) return null;
      t.log = t.log || {};
      t.log[date] = 1;
      t.rt = t.rt || {};
      save();
      return { full:true, streak:this.streak(id) };
    },
    untickHabit(id, date){
      const t = this.task(id); if(!t) return;
      if (t.log) delete t.log[date];
      save();
    },
    /** ימים ברצף. יום שאינו יום-חובה נדלג עליו ולא שובר. */
    streak(id){
      const t = this.task(id); if(!t || !this.isHabit(t)) return 0;
      let n = 0, k = Plan.today(), first = true, guard = 0;
      while (guard++ < 400){
        /* יום שדולג עליו בגלל חריג מתנהג כמו יום שאינו יום-חובה:
           הוא לא נספר, והוא גם לא שובר את הרצף. */
        if (this.habitRequired(t, k)){
          if (this.habitFull(t, k)) n++;
          else if (!first) break;          /* היום עוד לא נגמר — לא שובר */
        }
        first = false;
        k = Plan.shift(k, -1);
      }
      return n;
    },
    habitsFor(date){
      return data.tasks.filter(t => this.isHabit(t) && !t.archived && this.habitRequired(t, date));
    },

    /**
     * סימון ✓ בתצוגה. להרגל זה סימון יומי; לכל השאר זה סיום — והמשימה
     * עוברת מיד לארכיון, כפי שדורש סעיף 25 באפיון.
     */
    toggleTask(id, date){
      const t = this.task(id); if(!t) return;
      if (this.isHabit(t)){
        const d = date || Plan.today();
        if (this.habitFull(t, d)) this.untickHabit(id, d); else this.tickHabit(id, d);
        return;
      }
      this.finishTask(id);
    },

    /* ---------- מחזור חיים וארכיון (2.0) ---------- */
    isLong(t){ return !!t && t.kind === 'long'; },
    /** נשאר רק בשביל נתונים ישנים; המיגרציה ל-v7 כבר ניקתה אותם. */
    isList(t){ return !!t && t.kind === 'list'; },

    /**
     * סיום משימה קצרת-טווח. המשמעות היא "אני מחשיב את כל הדבר הזה כגמור",
     * ולכן כל העץ עובר לארכיון — גם אם נשארו בו תת-משימות פתוחות.
     * המצב הפנימי של הילדים נשמר כדי שהשחזור יחזיר את התמונה המדויקת.
     */
    finishTask(id){
      const t = this.task(id); if(!t) return;
      if (this.isHabit(t)){ this.tickHabit(id, Plan.today()); return; }
      const now = Date.now();
      t.done = true; t.doneAt = now; t.rt = {}; t.planned = null;
      t.archived = true; t.archivedAt = now; t.autoArch = false;
      this.descendants(id).forEach(c => {
        if (!c.archived){ c.archived = true; c.archivedAt = now; c.autoArch = true;
                          c.rt = {}; c.planned = null; }
      });
      save();
    },
    /** סגירה מפורשת של פריט ארוך-טווח */
    closeProject(id){ this.finishTask(id); },
    /**
     * מעבר לארוך-טווח. מיכל הוא מיכל: אין לו זמן, מיקום, נסיעה, תאריך,
     * חזרה או קישור לאירוע. מה שהיה נשמר ב-t.parked ולא נמחק, כדי
     * שהחזרה לקצר-טווח תוכל להחזיר אותו ושום נתון לא ייעלם בשקט.
     */
    makeLong(id){
      const t = this.task(id); if(!t) return;
      if (t.kind !== 'long') t.parked = this.parkSchedule(t);
      t.kind = 'long';
      t.reminder = null; t.repeat = null; t.planned = null; t.eventId = null;
      t.log = {}; t.rt = {};
      save();
    },
    /** צילום של כל מה שמיכל לא רשאי להחזיק */
    parkSchedule(t){
      const has = t.planned || t.reminder || t.repeat || t.eventId;
      if (!has) return null;
      return { planned:t.planned || null, reminder:t.reminder || null,
               repeat:t.repeat || null, eventId:t.eventId || null, at:Date.now() };
    },
    /** האם למשימה מותר להיות ארוכת-טווח: אסור מיכל בתוך מיכל, בכל עומק */
    canBeLong(id, parentId){
      const pid = parentId !== undefined ? parentId
                : (this.task(id) || {}).parentId;
      let p = pid ? this.task(pid) : null, guard = 0;
      while (p && guard++ < 16){
        if (p.kind === 'long') return false;
        p = p.parentId ? this.task(p.parentId) : null;
      }
      return true;
    },

    /** החזרה מהארכיון — המשימה וכל מה שאורכב יחד איתה */
    restoreTask(id){
      const t = this.task(id); if(!t) return;
      t.archived = false; t.archivedAt = null; t.done = false; t.doneAt = null; t.autoArch = false;
      this.descendants(id).forEach(c => {
        if (c.autoArch){ c.archived = false; c.archivedAt = null; c.autoArch = false; }
      });
      /* אב מאורכב היה מסתיר את המשימה המשוחזרת */
      let p = t.parentId ? this.task(t.parentId) : null, guard = 0;
      while (p && guard++ < 12){
        if (p.archived){ p.archived = false; p.archivedAt = null; p.done = false; p.doneAt = null; }
        p = p.parentId ? this.task(p.parentId) : null;
      }
      save();
    },
    /* ---------- רשימה לשימוש חוזר ----------
       "רשימה" היא לא ישות חדשה — זו משימה עם תת-משימות. איפוס מחזיר את
       הפריטים שסומנו למצב פעיל, בלי לשכפל ובלי למחוק היסטוריה גלובלית.
       הפונקציה טהורה ומקבלת מזהה בלבד, כך שאיפוס אוטומטי בעתיד
       (כל יום ראשון, כל שבוע) יוכל לקרוא לה בלי שינוי נוסף. */

    /** כמה פריטים ברשימה מסומנים כרגע — רק הם מתאפסים */
    resettableCount(id, clId){
      return this.checklist(id, clId).filter(x => x.checked).length;
    },
    /** האם יש כאן רשימת פריטים */
    hasChecklist(id){ return this.checklists(id).length > 0; },

    /**
     * מחזיר את כל צאצאי המשימה למצב פעיל, לכל עומק.
     * שם, הערה, מבנה, תזכורות והיררכיה נשארים בדיוק כפי שהם.
     * הרגלים לא מושפעים — הם ממילא לא מסומנים כגמורים.
     */
    /**
     * מאפס פריטי רשימה בלבד.
     * פריט ותת-משימה הם שני דברים שונים: פריט הוא סימון, תת-משימה היא
     * עבודה שנעשתה. איפוס הרשימה לא מחזיר לחיים תת-משימות שהסתיימו,
     * לא מוציא מהארכיון ולא נוגע בהרגלים.
     */
    resetChecklist(id, clId){
      const t = this.task(id); if(!t) return 0;
      let n = 0;
      /* שם, הערה וסדר נשמרים בדיוק. רק הסימון יורד. */
      this.checklist(id, clId).forEach(it => { if (it.checked){ it.checked = false; n++; } });
      t.lastResetAt = Date.now();
      save();
      return n;
    },

    /* ================= פריטי רשימה =================
       פריט חי בתוך המשימה עצמה: { id, title, note, checked }.
       הוא לא משימה: אין לו סוג, קטגוריה, תאריך, תזכורת, מיקום, נסיעה,
       חזרה, תת-פריטים, רשומת ארכיון או נוכחות במסך "היום".
       פריט מסומן נשאר גלוי — הערך שלו הוא לראות מה כבר נארז. */
    /* ---- צ׳קליסטים: משימה יכולה להחזיק כמה, כל אחד עם שם משלו ----
       "ציוד לקחת" ו"דברים לבדוק" הם שני דברים שונים, ולא ערבוב אחד.
       פריט נשאר ישות קלה: שם, הערה קצרה וסימון. */
    checklists(id){
      const t = this.task(id); if(!t) return [];
      if (!Array.isArray(t.checklists)) t.checklists = [];
      return t.checklists;
    },
    checklistOf(id, clId){
      return this.checklists(id).find(c => c.id === clId) || null;
    },
    /** פריטים. עם clId — של צ׳קליסט אחד; בלעדיו — כל הפריטים במשימה. */
    checklist(id, clId){
      const ls = this.checklists(id);
      if (clId){ const c = ls.find(x => x.id === clId); return c ? c.items : []; }
      return ls.reduce((acc, c) => acc.concat(c.items), []);
    },
    checklistStats(id, clId){
      const l = this.checklist(id, clId);
      return { total:l.length, checked:l.filter(x => x.checked).length };
    },
    addChecklist(id, name){
      const t = this.task(id); if(!t) return null;
      /* פריט חוזר הוא פעולה אטומית — הוא לא מחזיק תוכן */
      if (!this.canHoldContent(t)) return null;
      if (!Array.isArray(t.checklists)) t.checklists = [];
      const c = { id:uid(), name:String(name || '').trim() || 'צ׳קליסט', items:[], repeat:null };
      t.checklists.push(c); save(); return c;
    },
    /* ---------- צ׳קליסט חוזר ----------
       אותו אובייקט חוזר במחזורים. לא נוצר עותק חדש בכל שבוע: המחזור
       הפתוח נשאר פתוח עד שמסמנים, ולפני המופע הבא הסימונים מתאפסים. */
    setChecklistRepeat(id, clId, rep){
      const c = this.checklistOf(id, clId); if(!c) return false;
      c.repeat = rep ? {
        days: (rep.days || []).slice(),
        time: rep.time || '20:00',
        /* נקודת האיפוס קבועה: שש שעות לפני המופע הבא. השדה נשאר בנתונים
           כדי שרשומות ישנות ייטענו, אבל הוא כבר לא נשאל ולא משתנה. */
        resetMin: Recur.RESET_MIN,
        skipTypes: (rep.skipTypes || []).slice(),
        skipScope: rep.skipScope === 'week' ? 'week' : 'day',
        around: !!rep.around,
      } : null;
      if (c.repeat) c.rt = { cycle: Recur.nextDay(c.repeat, Plan.today()), doneAt:null };
      save(); return true;
    },
    /** התאריך הקרוב ביותר שבו הצ׳קליסט אמור להיות פתוח, מהיום קדימה */
    checklistNextDay(c, from){ return Recur.nextDay(c && c.repeat, from); },
    /**
     * מגלגל צ׳קליסט חוזר למחזור הבא. נקרא מה-Engine, ולכן חייב להיות
     * זול ואידמפוטנטי: הוא מאפס פעם אחת לכל מחזור, לפי מפתח שמור.
     */
    /**
     * מגלגל צ׳קליסט חוזר למחזור הבא.
     *
     * שלוש הכרעות שמייצרות את ההתנהגות שהאפיון דורש:
     * 1. מחזור שלא הושלם **נשאר פתוח** — לא בשעת היעד ולא בחצות. רק
     *    נקודת האיפוס סוגרת אותו, ולכן חצות לא מסתיר כלום.
     * 2. האיפוס קורה בדיוק שש שעות לפני המופע הבא, מ-Recur.
     * 3. אידמפוטנטי: מפתח המחזור נשמר, ולכן סימון באמצע מחזור לא נמחק
     *    בקריאה הבאה של המנוע.
     */
    rollChecklist(id, clId){
      const c = this.checklistOf(id, clId); if(!c || !c.repeat) return false;
      /* מחפשים את המופע שאחרי המחזור הפתוח, לא את המחזור עצמו */
      const open = (c.rt && c.rt.cycle) || '';
      const from = open ? Plan.shift(open, 1) : Plan.today();
      const nx = Recur.nextOccurrence(c.repeat, from);
      if (!nx) return false;
      c.rt = c.rt || {};
      if (Date.now() < nx.resetAt) return false;     /* עוד לא הגיע האיפוס */
      if (c.rt.cycle === nx.day) return false;       /* המחזור הזה כבר הוכן */
      c.rt.cycle = nx.day;
      c.rt.doneAt = null;
      c.items.forEach(x => { x.checked = false; });
      save(); return true;
    },
    /** המחזור הפתוח: היום שאליו הצ׳קליסט מכוון כרגע */
    checklistCycle(c){
      if (!c || !c.repeat) return '';
      if (c.rt && c.rt.cycle) return c.rt.cycle;
      return Recur.nextDay(c.repeat, Plan.today());
    },
    /** מחזור מושלם = כל הפריטים מסומנים. אין פעולת סיום נפרדת. */
    checklistCycleDone(c){
      return !!(c && c.repeat && c.items.length && c.items.every(x => x.checked));
    },
    renameChecklist(id, clId, name){
      const c = this.checklistOf(id, clId); if(!c) return false;
      const n = String(name || '').trim(); if (!n) return false;
      c.name = n; save(); return true;
    },
    delChecklist(id, clId){
      const t = this.task(id); if(!t) return null;
      const i = this.checklists(id).findIndex(c => c.id === clId);
      if (i < 0) return null;
      const gone = t.checklists.splice(i, 1)[0]; save();
      return { list:gone, at:i };
    },
    insertChecklist(id, list, at){
      const t = this.task(id); if(!t) return;
      if (!Array.isArray(t.checklists)) t.checklists = [];
      t.checklists.splice(Math.max(0, Math.min(at == null ? t.checklists.length : at,
                                               t.checklists.length)), 0, list);
      save();
    },
    moveChecklist(id, clId, dir){
      const l = this.checklists(id), i = l.findIndex(c => c.id === clId), j = i + dir;
      if (i < 0 || j < 0 || j >= l.length) return false;
      l.splice(j, 0, l.splice(i, 1)[0]); save(); return true;
    },
    /** הצ׳קליסט שמחזיק פריט מסוים — כדי שפעולות ישנות ימשיכו לעבוד בלי clId */
    ownerOf(id, itemId){
      return this.checklists(id).find(c => c.items.some(x => x.id === itemId)) || null;
    },
    addChecklistItem(id, clIdOrTitle, titleOrNote, maybeNote){
      /* חתימה סובלנית: (id, clId, title, note) או (id, title, note) */
      let clId = clIdOrTitle, title = titleOrNote, note = maybeNote;
      if (!this.checklistOf(id, clIdOrTitle)){
        clId = null; title = clIdOrTitle; note = titleOrNote;
      }
      const t = this.task(id); if(!t) return null;
      const ttl = String(title || '').trim(); if (!ttl) return null;
      let c = clId ? this.checklistOf(id, clId) : this.checklists(id)[0];
      if (!c) c = this.addChecklist(id, 'צ׳קליסט');
      const it = { id:uid(), title:ttl, note:note || '', checked:false };
      c.items.push(it); save(); return it;
    },
    updateChecklistItem(id, itemId, patch){
      const c = this.ownerOf(id, itemId); if(!c) return;
      const it = c.items.find(x => x.id === itemId); if(!it) return;
      if (patch.title !== undefined){
        const ttl = String(patch.title).trim(); if (!ttl) return;
        it.title = ttl;
      }
      if (patch.note !== undefined) it.note = patch.note || '';
      if (patch.checked !== undefined) it.checked = !!patch.checked;
      save();
    },
    toggleChecklistItem(id, itemId){
      const c = this.ownerOf(id, itemId); if(!c) return null;
      const it = c.items.find(x => x.id === itemId); if(!it) return null;
      it.checked = !it.checked;
      /* בצ׳קליסט חוזר, סימון הפריט האחרון סוגר את המחזור מעצמו.
         אין פעולת "סיימתי" נפרדת — היא הייתה שלב שלא מוסיף מידע. */
      if (c.repeat){
        c.rt = c.rt || {};
        c.rt.doneAt = this.checklistCycleDone(c) ? Date.now() : null;
      }
      save(); return it.checked;
    },
    /** מחיקה מחזירה את הפריט, את הצ׳קליסט שלו ואת מקומו, כדי שאפשר יהיה לבטל */
    delChecklistItem(id, itemId){
      const c = this.ownerOf(id, itemId); if(!c) return null;
      const i = c.items.findIndex(x => x.id === itemId);
      if (i < 0) return null;
      const gone = c.items.splice(i, 1)[0]; save();
      return { item:gone, at:i, clId:c.id };
    },
    insertChecklistItem(id, item, at, clId){
      const c = clId ? this.checklistOf(id, clId) : this.checklists(id)[0];
      if (!c) return;
      c.items.splice(Math.max(0, Math.min(at == null ? c.items.length : at,
                                          c.items.length)), 0, item);
      save();
    },
    moveChecklistItem(id, itemId, dir){
      const c = this.ownerOf(id, itemId); if(!c) return false;
      const l = c.items, i = l.findIndex(x => x.id === itemId), j = i + dir;
      if (i < 0 || j < 0 || j >= l.length) return false;
      l.splice(j, 0, l.splice(i, 1)[0]); save(); return true;
    },

    /* ================= תת-משימות והרגלים =================
       שני מקטעים נפרדים תחת אותה משימה, כל אחד עם סדר משלו. */
    ordered(list){
      return list.slice().sort((a,b) =>
        (a.sortIndex || 0) - (b.sortIndex || 0) || (a.createdAt || 0) - (b.createdAt || 0));
    },
    subtasksOf(id){ return this.ordered(this.children(id).filter(c => !this.isHabit(c))); },
    habitsOf(id){   return this.ordered(this.children(id).filter(c =>  this.isHabit(c))); },
    /** הזזה בתוך המקטע שאליו הפריט שייך בלבד */
    moveChild(id, dir){
      const t = this.task(id); if(!t) return false;
      const sec = this.isHabit(t) ? this.habitsOf(t.parentId) : this.subtasksOf(t.parentId);
      return this.reorder(sec, id, dir);
    },
    /**
     * הזזה כללית. משימת שורש זזה בתוך הקטגוריה שלה בלבד — אחרת היא הייתה
     * קופצת בין קבוצות הצבע, וזה בדיוק מה שהקיבוץ בא למנוע.
     */
    /** קובע סדר מפורש לרשימת מזהים. שייך תמיד לקבוצה אחת. */
    orderIds(ids){
      ids.forEach((id, k) => { const t = this.task(id); if (t) t.sortIndex = k; });
      save(); return true;
    },

    /* ---- סדר גלובלי אחד למשימות הראשיות ----
       "הכול", כל קטגוריה וכל אזור הם תצוגות של אותו רצף. אין סדרים
       נפרדים שסותרים זה את זה: הזזה בתוך אזור מחליפה שני מקומות ברצף
       הגלובלי, וכל השאר נשאר בדיוק איפה שהיה. */
    allRoots(){
      return this.ordered(data.tasks.filter(t => !t.parentId && !t.archived));
    },
    /** ממספר מחדש את הרצף הגלובלי, כדי שהשוואות והחלפות יהיו יציבות */
    normalizeRootOrder(){
      this.allRoots().forEach((t, i) => { t.sortIndex = i; });
    },
    /**
     * מזיז משימה ראשית צעד אחד בתוך ההקשר הנראה (אזור, קטגוריה או
     * רשימה רציפה). `visibleIds` הוא מה שהמשתמש באמת רואה.
     */
    moveRootIn(id, dir, visibleIds){
      const i = visibleIds.indexOf(id), j = i + dir;
      if (i < 0 || j < 0 || j >= visibleIds.length) return false;
      this.normalizeRootOrder();
      const a = this.task(id), b = this.task(visibleIds[j]);
      if (!a || !b) return false;
      const tmp = a.sortIndex; a.sortIndex = b.sortIndex; b.sortIndex = tmp;
      save(); return true;
    },
    moveTask(id, dir){
      const t = this.task(id); if(!t) return false;
      if (t.parentId) return this.moveChild(id, dir);
      return this.moveRootIn(id, dir, this.allRoots().map(x => x.id));
    },
    reorder(list, id, dir){
      const i = list.findIndex(x => x.id === id), j = i + dir;
      if (i < 0 || j < 0 || j >= list.length) return false;
      list.splice(j, 0, list.splice(i, 1)[0]);
      list.forEach((x,k) => { x.sortIndex = k; });
      save(); return true;
    },
    /** תת-משימה מתכווצת לפריט קל ברשימה של ההורה */
    toChecklistItem(id){
      const t = this.task(id); if(!t || !t.parentId) return null;
      const p = this.task(t.parentId); if(!p) return null;
      const it = this.addChecklistItem(p.id, t.title, t.note || '');
      if (it && (t.archived || t.done)) it.checked = true;
      this.delTask(id);
      return it;
    },
    /** תת-משימה נגמלת מההורה ועומדת בפני עצמה */
    toIndependent(id){
      const t = this.task(id); if(!t || !t.parentId) return false;
      t.parentId = null; t.autoArch = false;
      t.sortIndex = this.freeIndex(t);
      save(); return true;
    },

    /** שורשי הארכיון: פריט שההורה שלו אינו מאורכב — כדי לא לכפול עצים */
    archived(){
      return data.tasks
        .filter(t => t.archived && !(t.parentId && (this.task(t.parentId)||{}).archived))
        .sort((a,b) => (b.archivedAt||0) - (a.archivedAt||0));
    },
    archivedCount(){ return data.tasks.filter(t => t.archived).length; },

    /* ---------- סוגי אירוע ---------- */
    eventTypes(){ return data.eventTypes; },
    eventType(id){ return data.eventTypes.find(x => x.id === id) || data.eventTypes[0] || null; },
    addEventType(name, color){
      const t = { id:uid(), name, color };
      data.eventTypes.push(t); save(); return t;
    },
    updateEventType(id, patch){ const t=data.eventTypes.find(x=>x.id===id); if(t){ Object.assign(t,patch); save(); } },
    delEventType(id){
      if (data.eventTypes.length <= 1) return false;
      data.eventTypes = data.eventTypes.filter(x => x.id !== id);
      const fb = data.eventTypes[0].id;
      data.events.forEach(e => { if (e.typeId === id) e.typeId = fb; });
      save(); return true;
    },

    delTask(id){
      const kill = new Set([id, ...this.descendants(id).map(t=>t.id)]);
      data.tasks = data.tasks.filter(x => !kill.has(x.id));
      save();
    },

    addPlace(name, lat, lng, radius, parentId){
      const p = { id:uid(), name, lat, lng, radius: radius||200, parentId: parentId||null };
      data.places.push(p); save(); return p;
    },
    delPlace(id){
      /* מחיקת מקום ראשי מוחקת גם את תת-המקומות שלו */
      const kill = new Set([id, ...data.places.filter(p=>p.parentId===id).map(p=>p.id)]);
      data.places = data.places.filter(p => !kill.has(p.id));
      data.tasks.forEach(t=>{ if(t.reminder && kill.has(t.reminder.placeId)) t.reminder = null; });
      save();
    },
    place(id){ return data.places.find(p=>p.id===id); },
    placeByName(n){ return data.places.find(p=>p.name===n); },
    /** מקומות ראשיים — רק להם יש גדר אמיתית במערכת ההפעלה */
    topPlaces(){ return data.places.filter(p => !p.parentId); },
    subPlaces(id){ return data.places.filter(p => p.parentId === id); },
    /** מטפס עד המקום הראשי. תת-מקום לעולם לא נרשם כגדר בפני עצמו. */
    placeRoot(id){
      let p = this.place(id), guard = 0;
      while (p && p.parentId && guard++ < 8) p = this.place(p.parentId);
      return p || null;
    },

    /* ---------- רשימות ---------- */
    list(id){ return data.lists.find(l => l.id === id); },
    /** האירוע שהרשימה שובצה בו, אם יש */
    listEvent(listId){ return data.events.find(e => e.listId === listId) || null; },
    addList(o){
      const l = { id:uid(), name:o.name, kind:o.kind||'simple', forWho:o.forWho||'',
                  phone:o.phone||'', createdAt:Date.now(), items:[] };
      data.lists.unshift(l); save(); return l;
    },
    updateList(id, patch){ const l=this.list(id); if(l){ Object.assign(l, patch); save(); } },
    delList(id){ data.lists = data.lists.filter(l=>l.id!==id); save(); },
    addItem(listId, o){
      const l = this.list(listId); if(!l) return null;
      const it = { id:uid(), title:o.title, where:o.where||'', link:o.link||'', img:o.img||'',
                   done:false, price:(o.price==null?null:o.price), note:o.note||'',
                   releaseDate:o.releaseDate||'', notified:false, createdAt:Date.now() };
      l.items.unshift(it); save(); return it;
    },
    updateItem(listId, itemId, patch){
      const l=this.list(listId); if(!l) return;
      const it=l.items.find(x=>x.id===itemId); if(!it) return;
      Object.assign(it, patch); save();
    },
    toggleItem(listId, itemId){
      const l=this.list(listId); if(!l) return;
      const it=l.items.find(x=>x.id===itemId); if(it){ it.done=!it.done; save(); }
    },
    delItem(listId, itemId){
      const l=this.list(listId); if(!l) return;
      l.items = l.items.filter(x=>x.id!==itemId); save();
    },
    /** כל הפריטים הפתוחים מכל הרשימות — לתכנון מסלול */
    openItems(){
      const out=[];
      data.lists.forEach(l => l.items.forEach(i => { if(!i.done) out.push({...i, listId:l.id, listName:l.name}); }));
      return out;
    },

    /** אירוע רב-יומי מופיע בכל יום בטווח שלו */
    onDay(e, date){ return e.endDate ? (date >= e.date && date <= e.endDate) : e.date === date; },
    events(date){
      return data.events.filter(e => this.onDay(e, date))
                        .sort((a,b) => (a.time||'').localeCompare(b.time||''));
    },
    eventCount(date){ return data.events.filter(e => this.onDay(e, date)).length; },
    event(id){ return data.events.find(e=>e.id===id); },
    /** אירועים שנוגעים ביום, כולל רב-יומיים שרק עוברים דרכו */
    spanning(date){
      return data.events.filter(e => this.onDay(e, date) &&
        (e.allDay || (e.endDate && e.endDate !== e.date)));
    },
    addEvent(o){
      const ev = { id:uid(), title:o.title, date:o.date, time:o.time||'09:00',
        end:o.end||'10:00', endDate:o.endDate||'',
        typeId:o.typeId || (data.eventTypes[0] && data.eventTypes[0].id) || 't_pers',
        remindMin:(o.remindMin==null?15:o.remindMin), note:o.note||'', rt:{},
        allDay:!!o.allDay, listId:o.listId||null };
      data.events.push(ev); save(); return ev;
    },
    updateEvent(id, patch){ const e=this.event(id); if(e){ Object.assign(e, patch); e.rt={}; save(); } },
    delEvent(id){
      data.events = data.events.filter(e=>e.id!==id);
      data.tasks.forEach(t=>{ if(t.eventId===id) t.eventId=null; });
      save();
    },

    /* ---------- הערות ---------- */
    /* ---------- קיצורי אתרים בספרייה ----------
       קישורים שהמשתמש שומר בעצמו. תוכן, לא הגדרה — ולכן הם חיים
       בספרייה לצד ההערות והרשימות. */
    links(){ return (data.links || []).slice(); },
    addLink(name, url){
      const u = this.cleanUrl(url); if (!u) return null;
      if (!Array.isArray(data.links)) data.links = [];
      const l = { id:uid(), name:String(name||'').trim() || this.hostOf(u), url:u };
      data.links.push(l); save(); return l;
    },
    updateLink(id, patch){
      const l = (data.links||[]).find(x => x.id === id); if(!l) return false;
      if (patch.url !== undefined){
        const u = this.cleanUrl(patch.url); if (!u) return false;
        l.url = u;
      }
      if (patch.name !== undefined) l.name = String(patch.name).trim() || this.hostOf(l.url);
      save(); return true;
    },
    delLink(id){
      const i = (data.links||[]).findIndex(x => x.id === id);
      if (i < 0) return null;
      const gone = data.links.splice(i, 1)[0]; save();
      return { link:gone, at:i };
    },
    insertLink(link, at){
      if (!Array.isArray(data.links)) data.links = [];
      data.links.splice(Math.min(at, data.links.length), 0, link); save();
    },
    moveLink(id, dir){
      const l = data.links || [];
      const i = l.findIndex(x => x.id === id); if (i < 0) return;
