plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'il.mesima.app'
    compileSdk 35

    defaultConfig {
        applicationId "il.mesima.app"
        minSdk 29
        targetSdk 35
        versionCode 11
        versionName "1.1"
    }

    /* מפתח חתימה קבוע שנשמר בריפו.
       עד כאן ה-APK נחתם ב-signingConfigs.debug, ומפתח ה-debug נוצר מחדש
       בכל ריצה של CI עם ערכים אקראיים — כלומר כל בנייה יצאה עם חתימה אחרת.
       אנדרואיד מסרב להתקין עדכון בחתימה שונה, וזה מה שהחזיר
       "App not installed" בכל ניסיון לעדכן. עם מפתח קבוע כל בנייה עתידית
       מתקינה מעל הקודמת בלי למחוק שום נתון. */
    signingConfigs {
        mesima {
            storeFile file('mesima.jks')
            storePassword project.findProperty('mesimaStorePass') ?: 'mesima2026'
            keyAlias 'mesima'
            keyPassword project.findProperty('mesimaKeyPass') ?: 'mesima2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.mesima
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.mesima
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // play-services-location גורר androidx.fragment ישן, ו-androidx.activity
    // דורש 1.3.0+. בלי הצהרה מפורשת Gradle לא מכריע ונופל עם
    // "Upgrade Fragment version to at least 1.3.0."
    implementation 'androidx.fragment:fragment:1.8.5'
    // WebViewAssetLoader: מגיש קבצים מקומיים מעל origin וירטואלי של https.
    // בלעדיו כל החלפה בין file:// לרשת הייתה משנה origin ומאבדת את כל הנתונים.
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
