plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'il.mesima.app'
    compileSdk 35

    defaultConfig {
        applicationId "il.mesima.app"
        minSdk 29
        targetSdk 35
        versionCode 9
        versionName "0.9"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // חתימה בחתימת debug כדי שה-APK יהיה בר-התקנה ישירות מ-CI
            signingConfig signingConfigs.debug
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // play-services-location גורר androidx.fragment ישן, ו-androidx.activity
    // דורש 1.3.0+. בלי הצהרה מפורשת Gradle לא מכריע ונופל עם
    // "Upgrade Fragment version to at least 1.3.0."
    implementation 'androidx.fragment:fragment:1.8.5'
    // WebViewAssetLoader: מגיש קבצים מקומיים מעל origin וירטואלי של https.
    // בלעדיו כל החלפה בין file:// לרשת הייתה משנה origin ומאבדת את כל הנתונים.
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
