name: Verify web and Android

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install verification dependencies
        run: npm ci

      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium

      - name: Build web assets and run model tests
        run: |
          node tools/build.mjs
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --exit-code -- index.html android/app/src/main/assets/index.html

      - name: Exercise browser flows and both sync transports
        run: npm run test:ui

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Firestore and Storage rules with local emulators
        run: npm run test:rules

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and compile Android
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon --console=plain

      - name: Verify the packaged native version contract
        run: python3 tools/verify-apk-version.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Save browser regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-results
          path: test-results/
          if-no-files-found: ignore

      # Debug builds are for developers. Install the signed APK in Releases.
      # An ordinary source push must not replace that APK with another signing key.
      - name: Save development APK
        uses: actions/upload-artifact@v4
        with:
          name: mesima-development-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
