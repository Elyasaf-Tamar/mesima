name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: unpack sources
        run: |
          rm -rf android
          unzip -q android-src.zip
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: build
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --warning-mode=none 2>&1 | tee ../build.log

      - name: report
        if: always()
        run: |
          {
            echo "## תוצאה: ${{ steps.build.outcome }}"
            if [ -f build.log ]; then
              echo "### מה נשבר"
              echo '```'
              grep -E "^e: |error: |^FAILURE|^\* What went wrong|^> |Caused by|Unresolved reference|not found" build.log | head -40
              echo '```'
              echo "### 60 השורות האחרונות"
              echo '```'
              tail -60 build.log
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.build.outcome }}" = "success" ]

      - name: collect apk
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/mesima.apk

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: mesima-apk
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        if: steps.build.outcome == 'success'
        with:
          tag_name: build-${{ github.run_number }}
          name: mesima build ${{ github.run_number }}
          files: out/*.apk
