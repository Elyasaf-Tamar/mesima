name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: unpack android sources
        run: |
          if [ ! -f android-src.zip ]; then
            echo "::error::android-src.zip not found in repo root"
            exit 1
          fi
          rm -rf android
          unzip -q android-src.zip
          if [ ! -f android/settings.gradle ]; then
            echo "::error::zip unpacked but android/settings.gradle missing"
            exit 1
          fi
          mkdir -p android/app/src/main/assets

      - name: put app into apk
        run: cp index.html android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk     out/mesima-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/mesima.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mesima-apk
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: mesima build ${{ github.run_number }}
          files: out/*.apk
