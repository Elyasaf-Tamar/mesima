name: Publish app website

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare the verified standalone app
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy the app
        id: deployment
        uses: actions/deploy-pages@v5.0.1
