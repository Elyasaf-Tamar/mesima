name: בניית APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # מאפשר להריץ ידנית מלשונית Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: רכיבי SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: עדכון האפליקציה בתוך ה-APK
        run: cp index.html android/app/src/main/assets/index.html

      - name: בנייה
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: שם קריא לקובץ
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk       out/mesima-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk   out/mesima.apk
          ls -la out

      - name: העלאת ה-APK
        uses: actions/upload-artifact@v4
        with:
          name: mesima-apk
          path: out/*.apk
          retention-days: 90

      - name: פרסום כשחרור (נוח להורדה מהטלפון)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: משימה — בנייה ${{ github.run_number }}
          files: out/*.apk
          generate_release_notes: false
          body: |
            הורד את **mesima.apk** מהטלפון ופתח אותו כדי להתקין.
            אם אנדרואיד שואל — אשר התקנה ממקור לא מוכר לדפדפן/מנהל הקבצים.
